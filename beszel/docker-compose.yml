# Beszel monitoring — hub + agent tren vpn6. KEY agent lay tu .env (BESZEL_PUB).
services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    networks: [memnet]
    ports:
      - "127.0.0.1:8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # SSO tu CMS: memory-caddy forward_auth -> derp-backend /api/auth/forward, roi
    # chep X-Auth-Email sang day. Caddy PHAI xoa header nay tu client truoc.
    # Cong 127.0.0.1:8090 van nhan header truc tiep — chi root tren vpn6 toi duoc.
    environment:
      TRUSTED_AUTH_HEADER: "X-Auth-Email"
    volumes:
      - ./beszel_data:/beszel_data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: "45876"
      KEY: "${BESZEL_PUB}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
networks:
  memnet:
    external: true
    name: memory-stack_memnet
