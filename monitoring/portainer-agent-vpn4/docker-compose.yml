# Portainer Agent tren vpn4 — cho Portainer server (vpn6) xem/quan ly docker vpn4.
# Cong 9001 chi mo cho IP vpn6 qua ufw (workflow lo), them AGENT_SECRET (env
# tu GitHub secret PORTAINER_AGENT_SECRET) de ket noi la 2 lop bao ve.
services:
  portainer-agent:
    image: portainer/agent:lts
    container_name: portainer-agent
    restart: unless-stopped
    environment:
      - AGENT_SECRET=${AGENT_SECRET}
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
