# vpn6 = DERP CHUAN (derper) giong vpn4 — KHONG dung custom relay tcp/udp.
# Khac vpn4 o CHO DUY NHAT: vpn6 la box memory-stack, da co sslh nghe 443.
#
# LUU Y CONG: sslh hien tai (dang CLI don gian) forward TOAN BO TLS -> 127.0.0.1:8443
# = memory-caddy. Vi vay derper KHONG duoc dung 8443 (dung Caddy) -> dung 8444.
# Cutover (mai) phai nang sslh len dang config co SNI: vpn6 SNI -> 8444 (derper),
# con lai -> 8443 (Caddy). Xem README.md.
#
# Derper KHONG chiem 443/80 cong, ma:
#   - Nghe TLS noi bo o 127.0.0.1:8444  -> sslh route SNI vpn6.hangocthanh.io.vn vao day
#   - Cert Let's Encrypt qua TLS-ALPN-01 (sslh forward raw TLS theo SNI, derper tu lam cert)
#   - http-port=-1 (tat HTTP, khong can cong 80 — Caddy memory-stack van giu 80)
#   - STUN 3478/udp mo THANG ra host (UDP, sslh khong dinh toi)
# => derper van la code chuan, KHONG mix. sslh chi them 1 rule SNI (xem README.md).
services:
  derper:
    build:
      context: ../derp-vpn3   # dung Dockerfile.derper cua vpn3 (giong vpn4/vpn5)
      dockerfile: Dockerfile.derper
      # Cung phien ban voi vpn4 (v1.100.0 chay on tu 2026-07-03) de hai relay
      # hanh xu giong nhau; v1.100.0 can Go >= 1.26.
      args:
        GO_VERSION: "1.26"
        TAILSCALE_VERSION: v1.100.0
    container_name: derper
    restart: unless-stopped
    command:
      - --hostname=vpn6.hangocthanh.io.vn
      # PHAI la :443 BEN TRONG container: derper chi bat TLS (autocert) khi dia chi
      # nghe la cong 443 (tsweb.IsProd443) — nghe :8444 thi no phuc vu PLAINTEXT
      # va sslh forward TLS vao se loi "wrong version number" (da dinh 2026-09-05).
      # Cong 8444 chi ton tai o phia host (xem ports), sslh route SNI vpn6 vao do.
      - --a=:443
      - --http-port=-1       # tat HTTP -> cert qua TLS-ALPN-01, khong dung cong 80
      - --certmode=letsencrypt
      - --certdir=/data/derper-certs
      - --stun
      - --stun-port=3478
      - --verify-clients=false
    ports:
      - "127.0.0.1:8444:443"    # host 8444 (chi localhost, cho sslh) -> container 443 (TLS)
      - "3478:3478/udp"         # STUN cong cong (can ufw allow 3478/udp)
    volumes:
      - derper_certs:/data/derper-certs

  # ⚠️ SIDECAR TAILSCALE DA BI GO (2026-08-15) — GIONG relay-vpn6/docker-compose.yml.
  # Node "vpn6" chay NATIVE tren host qua systemd unit `tailscale-node`, UDP 41642
  # (41641 da bi docker-proxy cua relay chiem). File NAY cung tung khai ts-vpn6:
  # neu chi sua relay-vpn6 ma quen file nay thi ai chay deploy-derp-vpn6.yml sau do
  # se dung LAI mot node trung hostname "vpn6" va tranh socket.
  # Xem docs/plan-linux-node-vpn6-vpn4.md.

  # Ping-reporter: moi 30s ping tung peer, POST ket qua len collector voi src='vpn6'.
  ping-reporter:
    image: python:3.12-slim
    container_name: ping-reporter-vpn6
    restart: unless-stopped
    # network_mode: host -> dung thang tailscale0 cua host.
    network_mode: host
    command: ["python3", "/app/reporter.py"]
    environment:
      - REPORTER_NAME=vpn6
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - POLL_INTERVAL=30
      - COLLECTOR_PORT=8090
      - PING_TIMEOUT=8
    volumes:
      - ../ping-reporter/reporter.py:/app/reporter.py:ro
      # BIND MOUNT THU MUC — xem ghi chu o relay-vpn6/docker-compose.yml.
      - /var/run/tailscale:/var/run/tailscale

volumes:
  derper_certs:
  # tailscale_vpn6 / ts_sock da bo cung sidecar (giu volume cu tren may de con
  # duong lui; don tay khi da chac chan).
