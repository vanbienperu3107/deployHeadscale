# Template config CLIProxyAPI. Workflow deploy-cliproxy.yml copy file nay thanh
# cliproxy/config.yaml tren vpn4 va thay 2 placeholder bang secrets:
#   __API_KEY__          <- secrets.CLIPROXY_API_KEY
#   __MANAGEMENT_KEY__   <- secrets.CLIPROXY_MGMT_KEY
# KHONG dien key that vao file nay (CI co buoc quet secret).

# Bind moi interface: cong 8317 duoc publish cong khai tren vpn4, xac thuc bang
# api-keys ben duoi. Doi thanh "127.0.0.1" neu sau nay chi muon truy cap noi bo.
host: ""
port: 8317

# HTTPS. Hien tat: 443 cua vpn4 da thuoc ve derper (autocert), nen 8317 chay HTTP
# tran. Muon bat TLS thi tro cert/key vao day roi deploy lai.
tls:
  enable: false
  cert: ""
  key: ""

# Management API (/v0/management) + trang quan tri /management.html: mo ra Internet
# qua https://cliproxy.hangocthanh.io.vn/management.html, bao ve bang secret-key
# (CLIPROXY_MGMT_KEY; sai 5 lan => ban IP 30 phut). secret-key rong => tat han API nay.
remote-management:
  allow-remote: true
  secret-key: "__MANAGEMENT_KEY__"
  # Tai control panel tu GitHub ve lan dau truy cap /management.html.
  disable-control-panel: false

# Thu muc token OAuth — trung voi bind mount ./auths trong docker-compose.yml.
auth-dir: "/root/.cli-proxy-api"

# Khoa API cho client (bat buoc vi 8317 mo cong khai).
api-keys:
  - "__API_KEY__"

debug: false

# SU CO 2026-08-02: voi logging-to-file=true, moi request cua OpenCode sinh mot
# file "request-log-parts-request-body-*" phinh toi 32MB, dam bo nho container
# len 512MB -> kernel OOM-kill CLIProxyAPI giua chung -> client treo o "Thinking".
# commercial-mode tat request logging + middleware nang de giam bo nho moi request;
# logging-to-file=false dua log ra stdout (docker json-file da gioi han 10MB x 3).
commercial-mode: true
logging-to-file: false
error-logs-max-files: 10

# Lich su chat, ghi vao Postgres tren vpn6 (schema chat_history trong DB derp).
#
# Tinh nang RIENG cua fork vanbienperu3107/cliproxy_mod, khong co o ban upstream.
#
# Doc ky quan he voi commercial-mode o tren: co nay CO Y khong tat commercial-mode.
# Upstream chan ca duong ghi log khi commercial-mode bat; fork noi dung mot cong do
# cho lich su chat, nen cac middleware nang khac VAN TAT nhu tu sau su co 02/08.
#
# max-capture-bytes la thu giu cho su co do khong lap lai: khi mot RequestLogger
# duoc bat, upstream capture than request KHONG CO TRAN (shouldCaptureRequestBody
# tra true vo dieu kien, captureRequestInfo doc het vao RAM) — cac hang 1MiB/32MiB
# va co che spool ra dia cua no chi ap dung khi logger TAT. Fork ap tran ngay o
# middleware: doc toi da tran+1 byte cho log roi noi phan con lai vao than that,
# nen mot request 57MB chi ton bang tran chu khong phai 57MB.
#
# dsn tro toi container duong ham (cliproxy-pg-tunnel), khong phai vpn6 truc tiep.
chat-history:
  enabled: true
  dsn: "__CHAT_HISTORY_DSN__"
  max-capture-bytes: 1048576
  queue-size: 512
  retention-days: 90
  # Chi ghi cac endpoint hoi thoai. Neu de trong, upstream se dua MOI route (tru
  # /v0/management) vao logger kem toan bo header.
  paths:
    - /v1/chat/completions
    - /v1/messages
    - /v1/responses
  # Ghi them request/response THAT gui len provider (sau khi dich giao thuc, moi
  # lan retry). Tat di neu muon giam bo nho moi request.
  capture-upstream: true

# Thong ke dung luong cho Management API.
usage-statistics-enabled: true

# Retry khi upstream tra 403/408/429/500/502/503/504: so VONG retry them sau khi
# vong dau da thu het credential du dieu kien.
request-retry: 3

# 0 = moi vong thu HET credential dang co (khong chan so luong).
max-retry-credentials: 0

# BO QUA 429 THAY VI NAM CHO (yeu cau nguoi dung 2026-10-22).
# Tran thoi gian (giay) duoc phep NGU cho mot credential nguoi lai giua hai vong
# retry. Mac dinh cua CLIProxyAPI la 30 -> mot request co the treo toi 30s khi moi
# credential deu dang cooldown vi 429.
# Dat 0 = KHONG BAO GIO cho: credential nao dang cooldown thi bo qua luon, chi dung
# credential con khoe; het sach credential khoe thi tra loi ngay thay vi treo.
# (sdk/cliproxy/auth/conductor_selection.go: maxWait <= 0 -> moi cooldown wait > 0
# deu lam shouldRetryAfterError tra false.)
#
# KHONG dat disable-cooling: true de thay cho khoa nay — no lam nguoc y muon:
# credential vua 429 se khong bi danh dau cooldown nen vong sau lai chon trung no.
max-retry-interval: 0

# Het quota mot credential thi tu chuyen sang credential/model khac.
quota-exceeded:
  switch-project: true
  switch-preview-model: true

# Nhieu credential cung khop -> chon xoay vong.
routing:
  strategy: "round-robin"
  session-affinity: false
