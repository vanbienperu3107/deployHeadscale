services:
  derper:
    build:
      context: ../derp-vpn3   # dung Dockerfile.derper cua vpn3 (giong nhau)
      dockerfile: Dockerfile.derper
      # THU NGHIEM 2026-07-03: nang rieng vpn4 len derper v1.100.0 (override ARG
      # mac dinh v1.80.0 trong Dockerfile dung chung). vpn3/vpn6/vpn2 van v1.80.0.
      # v1.100.0 da chay on tren chinh host nay khi con la derper2 (da retire).
      # v1.100.0 yeu cau go >= 1.26.4 -> phai override luon GO_VERSION=1.26
      # (mac dinh 1.23 chi build duoc v1.80.0).
      args:
        GO_VERSION: "1.26"
        TAILSCALE_VERSION: v1.100.0
    container_name: derper
    restart: unless-stopped
    command:
      - --hostname=vpn4.hangocthanh.io.vn
      - --a=:443
      - --http-port=80
      - --certmode=letsencrypt
      - --certdir=/data/derper-certs
      - --stun
      - --stun-port=3478
      # --- KIEM SOAT TRUY CAP (bat 2026-09-07, xem docs/plan-derp-verify-clients.md
      # trong repo 03.Taile) -----------------------------------------------------
      # verify-clients=false: KHONG hoi tailscaled cuc bo. Co do can socket
      # tailscaled nhin thay duoc tu container; tailscaled o day chay NATIVE tren
      # host nen se phai bind-mount them - bo mat hong khong can thiet.
      - --verify-clients=false
      # Thay vao do hoi headscale qua admission controller: derper POST nodekey
      # cua client toi /verify, headscale tra Allow true/false
      # (hscontrol/handlers.go:97-110). Khong can gi tren host.
      - --verify-client-url=https://vpn2.hangocthanh.io.vn/verify
      # PHANH. fail-open=true: headscale khong with toi duoc thi VAN CHO client
      # qua, kem log "admission controller unreachable"
      # (derp/derpserver/derpserver.go:1573).
      #
      # ⚠️ KHONG doi thanh false ma khong co plan rieng. vpn4 o Peru phai goi ve
      # headscale o VN; duong Bitel da co tien le rot route toi vpn4. fail-closed
      # nghia la headscale khong voi toi = relay tu choi SACH toan bo client.
      #
      # ⚠️ Verify chay BEN TRONG duong bat tay voi timeout 5s
      # (derpserver.go:1557). Duong xau = moi ket noi DERP moi stall toi 5s roi
      # moi duoc fail-open cho qua. Do bang workflow derp-handshake-baseline.yml.
      - --verify-client-url-fail-open=true
    ports:
      # 80: ACME HTTP-01 cua chinh derper (autocert) — GIU NGUYEN tren host.
      - "80:80"
      # 443 KHONG con publish truc tiep: tu 2026-08-02, nginx cua stack edge-vpn4
      # giu 443 va dinh tuyen theo SNI. derper van tu terminate TLS bang cert
      # autocert cua no — nginx chi noi TCP thang (ssl_preread), khong dung toi
      # noi dung. Xem edge-vpn4/README.md.
      - "3478:3478/udp"
    networks:
      - edge
    volumes:
      - derper_certs:/data/derper-certs

  # ⚠️ SIDECAR TAILSCALE DA BI GO (2026-08-15). Node "vpn4" gio chay NATIVE tren
  # host qua systemd unit `tailscale-node` (binary tailscale_mod Linux). Ly do:
  # node nam trong netns container thi peer tailnet KHONG cham duoc dich vu cua
  # host — do chinh la muc dich cua plan. IP 100.64.0.4 duoc ghim qua CMS
  # (device_identity.static_ipv4 -> /api/internal/reserved-ip) nen cutover khong
  # lam troi IP. Xem docs/plan-linux-node-vpn6-vpn4.md.
  #
  # ⚠️ KHONG dung toi ts-vpngw/vpn-gw (stack vpn-gw/): do la netns rieng, giu
  # phien OpenVPN Bitel + tinyproxy + subnet route du phong.

  # Ping-reporter: moi 30s ping tung peer, POST ket qua len collector voi src='vpn4'.
  ping-reporter:
    image: python:3.12-slim
    container_name: ping-reporter-vpn4
    restart: unless-stopped
    # network_mode: host -> dung thang tailscale0 cua host (truoc day la netns cua
    # sidecar ts-vpn4, sidecar do khong con nua).
    network_mode: host
    command: ["python3", "/app/reporter.py"]
    environment:
      - REPORTER_NAME=vpn4
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - POLL_INTERVAL=30
      - COLLECTOR_PORT=8090
      - PING_TIMEOUT=8
    volumes:
      - ../ping-reporter/reporter.py:/app/reporter.py:ro
      # BIND MOUNT THU MUC (khong phai named volume): tailscaled chay native tren
      # host. Mount thu muc de socket moi sau moi lan daemon restart duoc thay ngay;
      # named volume/file .sock = "socket ma", reporter im lang mat ket noi.
      - /var/run/tailscale:/var/run/tailscale

networks:
  # Mang dung chung voi stack edge-vpn4 (nginx/caddy) va cliproxy. Tao san bang
  # `docker network create edge` — cac workflow deploy deu tu tao neu chua co.
  edge:
    name: edge
    external: true

volumes:
  derper_certs:
  # tailscale_vpn4 / ts_sock da bo cung sidecar. Volume cu KHONG bi xoa tu dong
  # (giu lai de con duong lui trong cua so cutover); don tay khi da chac chan.
