# vpn6 = hybrid relay CO-HOST tren box memory-stack (claude.hangocthanh.io.vn).
# Khac vpn5 (Traefik/Pangolin): o day Caddy san co (memory-caddy) lam reverse proxy.
# Caddy route Host(vpn6.hangocthanh.io.vn) -> relay-vpn6:8080 (xem caddy-vpn6.caddy).
# Relay join network memory-stack_memnet de Caddy goi duoc bang ten container.
services:

  # Custom hybrid DERP relay (TAI DUNG code Go cua relay-vpn5, giong het):
  # - TCP side (8080, qua Caddy): nhan ket noi DERP tu client
  # - UDP side (41641): gui WireGuard toi peer co endpoint UDP
  relay:
    build:
      context: ../relay-vpn5      # dung lai Dockerfile + *.go cua vpn5
      dockerfile: Dockerfile
    container_name: relay-vpn6
    restart: unless-stopped
    command:
      - -addr=:8080
      - -ts-socket=/var/run/tailscale/tailscaled.sock
      - -key-file=/data/relay.key
      - -cache-ttl=5s
    ports:
      - "41641:41641/udp"         # WireGuard UDP (can mo ufw 41641/udp)
    volumes:
      - relay_data:/data
      # BIND MOUNT THU MUC (khong phai named volume, khong phai file .sock):
      # tailscaled nay chay NATIVE tren host (systemd unit tailscale-node), khong
      # con sidecar container. Mount THU MUC de duong dan duoc phan giai lai o moi
      # connect() -> daemon restart tao socket inode moi thi relay thay ngay.
      # Mount file .sock hoac named volume = "socket ma": relay giu inode cu, im
      # lang mat ket noi, region 1003 chet ma `docker ps` van xanh.
      - /var/run/tailscale:/var/run/tailscale
    networks:
      - memnet                    # chung mang voi memory-caddy

  # Tailscale sidecar: join tailnet voi hostname "vpn6".
  # ⚠️ SIDECAR TAILSCALE DA BI GO (2026-08-15). Node "vpn6" gio chay NATIVE tren
  # host qua systemd unit `tailscale-node` (binary tailscale_mod Linux), vi:
  #   - node trong netns container thi peer tailnet KHONG cham duoc dich vu cua
  #     host (Postgres, SSH, derp-backend) — do la ca muc dich cua plan;
  #   - IP 100.64.0.7 duoc ghim qua CMS (device_identity.static_ipv4) nen cutover
  #     khong lam troi IP.
  # Host dung UDP 41642 (KHONG phai 41641) vi 41641 da bi docker-proxy cua relay
  # ben duoi chiem. Xem docs/plan-linux-node-vpn6-vpn4.md.

  # ⚠️ PING-REPORTER DA BI GO (2026-09-11) — xem ghi chu o derp-vpn4/docker-compose.yml.
  # Ten 'ping-reporter-vpn6' tung trung voi derp-vpn6/docker-compose.yml lam
  # deploy-relay-vpn6 do moi lan merge. KHONG them lai.

networks:
  memnet:
    external: true
    name: memory-stack_memnet     # network cua memory-stack (memory-caddy o day)

volumes:
  relay_data:
