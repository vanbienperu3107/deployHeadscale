# Stack "edge" cua vpn4: chia se cong 443 giua derper va CLIProxyAPI.
#
#   Internet :443
#        |
#   nginx (ssl_preread, KHONG giai ma)
#        |-- SNI vpn4.hangocthanh.io.vn (va mac dinh) --> derper:443   (TLS cua derper)
#        `-- SNI cliproxy.hangocthanh.io.vn           --> caddy-edge:8444
#                                                            |
#                                                       cliproxy:8317
#
# Cong 80 van thuoc ve derper (ACME HTTP-01 cua no) — stack nay khong dung 80.
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: edge-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy-edge:
    image: caddy:2.8-alpine
    container_name: caddy-edge
    restart: unless-stopped
    # Khong publish cong nao ra host: chi nginx goi toi, qua mang edge.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_edge_data:/data     # chung chi Let's Encrypt — mat la phai xin lai
      - caddy_edge_config:/config
      - caddy_edge_logs:/var/log/caddy   # log opencode ra file cho fail2ban doc
    networks:
      - edge
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Ban IP brute-force Basic Auth cua opencode (2026-08-30). Doc file log JSON
  # cua Caddy (volume chung), ban tai iptables HOST — vi the can network_mode
  # host + NET_ADMIN/NET_RAW. Khong dung toi log/duong di cua derper/cliproxy.
  fail2ban:
    image: lscr.io/linuxserver/fail2ban:1.1.0
    container_name: edge-fail2ban
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=Etc/UTC
    volumes:
      - ./fail2ban/jail.d:/config/fail2ban/jail.d:ro
      - ./fail2ban/filter.d:/config/fail2ban/filter.d:ro
      - fail2ban_config:/config
      - caddy_edge_logs:/remotelogs:ro
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: edge
    external: true

volumes:
  caddy_edge_data:
  caddy_edge_config:
  caddy_edge_logs:
  fail2ban_config:
