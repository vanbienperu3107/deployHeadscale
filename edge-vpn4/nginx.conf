# Dinh tuyen cong 443 cua vpn4 theo SNI — KHONG giai ma TLS.
#
# vpn4 chi co MOT IP cong khai (149.104.66.174) ma can hai dich vu tren 443:
#   - derper (DERP relay chinh cua ca tailnet, moi peer deu relay "vpn4-vn")
#   - CLIProxyAPI (proxy Claude/Codex — nhieu mang chi cho CONNECT :443)
#
# ssl_preread chi doc truong SNI trong ClientHello roi noi TCP thang toi backend:
# derper van tu terminate TLS bang cert autocert cua chinh no, byte khong bi dung
# toi, CPU gan nhu bang 0. Doi lai: khong the dinh tuyen theo duong dan, moi dich
# vu phai co ten mien rieng.

worker_processes auto;

events {
    worker_connections 4096;
}

stream {
    log_format sni '$remote_addr sni=$ssl_preread_server_name -> $backend '
                   'status=$status bytes=$bytes_sent/$bytes_received time=$session_time';

    # DNS noi bo cua Docker. Phan giai LUC CHAY chu khong luc doc config:
    #   - `nginx -t` khong doi backend phai ton tai san (buoc kiem cu phap trong
    #     workflow chay truoc khi derper vao mang edge);
    #   - derper hay cliproxy khoi dong lai doi IP thi nginx tu bat kip, khong can
    #     reload.
    # Dung khoi `upstream` se mat ca hai tinh chat tren (nginx bat buoc phai
    # resolve ngay luc doc config, hong la nginx khong khoi dong duoc — keo theo
    # ca DERP mat duong vao).
    resolver 127.0.0.11 ipv6=off valid=10s;

    map $ssl_preread_server_name $backend {
        cliproxy.hangocthanh.io.vn  caddy-edge:8444;
        # opencode di VONG qua listener noi bo 8446 (server duoi) de gan PROXY
        # protocol — Caddy can IP THAT cua client cho fail2ban. Truoc day tro
        # thang caddy-edge:8445 thi Caddy chi thay IP noi bo cua nginx
        # (172.23.0.x), log 401 vo dung cho viec ban (kiem chung 2026-08-30:
        # scanner Internet quet lien tuc ma khong ban duoc).
        opencode.hangocthanh.io.vn  127.0.0.1:8446;
        # Mac dinh (ke ca client khong gui SNI) -> derper. Chon default nay co chu
        # dich: loi cau hinh ten mien khong duoc lam chet DERP.
        default                     derper:443;
    }

    server {
        listen 443;
        listen [::]:443;

        ssl_preread on;
        proxy_pass $backend;

        # DERP giu ket noi rat lau va co the im lang giua cac keepalive.
        # Mac dinh 10 phut se cat nham -> dat 1 gio.
        proxy_timeout 1h;
        proxy_connect_timeout 5s;
        proxy_socket_keepalive on;

        access_log /dev/stdout sni;
    }

    # Chang 2 cua duong opencode: nhan tu chinh server 443 o tren (chi noi bo,
    # khong publish), gan PROXY protocol header roi moi noi toi Caddy. Stream
    # module chi bat/tat proxy_protocol theo TUNG server{} — khong lam theo
    # tung backend trong map duoc, nen phai tach 2 chang nhu vay.
    server {
        listen 127.0.0.1:8446;

        # Bien + resolver de phan giai LUC CHAY (cung ly do voi khoi tren):
        # caddy-edge restart doi IP thi nginx tu bat kip.
        set $opencode_backend caddy-edge:8445;
        proxy_pass $opencode_backend;
        proxy_protocol on;

        proxy_timeout 1h;
        proxy_connect_timeout 5s;
        proxy_socket_keepalive on;
    }
}
