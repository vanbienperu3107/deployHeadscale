# Bat cac dong log JSON cua Caddy co status 401 tren site opencode.
# File log CHI chua site opencode (log block nam trong site do) nen khong can
# match them ten mien. client_ip la IP THAT nho PROXY protocol tu nginx chang 2.
[Definition]
failregex = ^.*"client_ip":"<HOST>".*"status":401
datepattern = "ts":\s*{EPOCH}
