# Chi bat dong JSON trong access log RIENG cua OpenCode v2 co remote_ip that va
# HTTP 401; khong match log DERP, CLIProxy hoac OpenCode v1. Caddy ghi client
# sau PROXY protocol vao request.remote_ip (khong phai client_ip).
[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"status":401
datepattern = "ts":\s*{EPOCH}
