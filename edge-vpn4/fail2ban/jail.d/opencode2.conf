# Ban brute-force HTTP Basic Auth cho opencode2.hangocthanh.io.vn ma khong
# dung chung log/jail OpenCode v1. Caddy :8450 nhan PROXY protocol nen
# client_ip la IP cong khai thuc cua client.
[opencode2-401]
enabled = true
filter = opencode2-401
logpath = /remotelogs/opencode2-access.log
maxretry = 5
findtime = 600
bantime = 3600
banaction = iptables-allports
chain = DOCKER-USER
