# Ban IP brute-force/scan Basic Auth cua opencode.hangocthanh.io.vn.
#
# 5 lan 401 trong 10 phut -> ban 1 gio o iptables host (fail2ban chay
# network_mode: host + NET_ADMIN). Chi ban duoc nho IP THAT tu PROXY protocol
# (nginx chang 2 -> Caddy :8445) — xem nginx.conf va Caddyfile cung thu muc.
#
# banaction allports: ke bi ban mat luon duong vao 443 (ca DERP) tu IP do —
# chap nhan duoc vi IP dang brute-force khong phai client hop phap cua tailnet;
# node tailnet that xac thuc bang key, khong bao gio sinh 401 o day.
[opencode-401]
enabled = true
filter = opencode-401
logpath = /remotelogs/opencode-access.log
maxretry = 5
findtime = 600
bantime = 3600
banaction = iptables-allports
# BAT BUOC chain DOCKER-USER: traffic vao cong 443 do Docker publish di qua
# chain FORWARD/DOCKER-USER, KHONG qua INPUT — de mac dinh (INPUT) thi rule ban
# ton tai nhung goi tin khong bao gio cham toi, ban vo tac dung.
chain = DOCKER-USER
