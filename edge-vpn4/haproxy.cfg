# L4 SNI demultiplexer for vpn4. HAProxy does not decrypt TLS: DERP and Caddy
# keep certificate ownership. Unlike nginx stream, send-proxy is per backend,
# so OpenCode gets the original client IP without a second hop that overwrites it.
global
  log stdout format raw local0

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 1h
  timeout server 1h

resolvers docker
  nameserver docker 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend tls_sni_443
  bind :443
  log-format "%ci:%cp sni=%[req.ssl_sni] backend=%b/%s status=%ST bytes=%B"
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  use_backend cliproxy if { req.ssl_sni -i cliproxy.hangocthanh.io.vn }
  use_backend opencode if { req.ssl_sni -i opencode.hangocthanh.io.vn }
  use_backend opencode2 if { req.ssl_sni -i opencode2.hangocthanh.io.vn }
  use_backend portainer if { req.ssl_sni -i portainer.hangocthanh.io.vn }
  default_backend derper

backend derper
  server derper derper:443 resolvers docker init-addr none

backend cliproxy
  server cliproxy caddy-edge:8444 resolvers docker init-addr none

backend opencode
  server opencode caddy-edge:8445 resolvers docker init-addr none send-proxy

backend opencode2
  server opencode2 caddy-edge:8450 resolvers docker init-addr none send-proxy

backend portainer
  server portainer caddy-edge:8447 resolvers docker init-addr none
