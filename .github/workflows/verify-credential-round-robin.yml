name: Verify credential round robin (vpn4)
on: { workflow_dispatch: {} }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot auth counters
        id: before
        env:
          HOST: ${{ secrets.SSH_HOST_VPN4 }}
          API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          MGMT_KEY: ${{ secrets.CLIPROXY_MGMT_KEY }}
        run: |
          for p in claude codex; do
            curl -sf --max-time 20 -H "Authorization: Bearer $MGMT_KEY" "http://$HOST:28417/v8/management/auth-files?provider=$p" -o "/tmp/before-$p.json"
            echo "=== BEFORE $p"
            python3 - "$p" <<'PY'
          import json,sys
          provider=sys.argv[1]; d=json.load(open(f'/tmp/before-{provider}.json'))
          for x in d.get('files',[]): print(x.get('id'), x.get('name'), x.get('provider'), 'success=',x.get('success'),'failed=',x.get('failed'))
          PY
          done
      - name: Send independent requests
        env:
          HOST: ${{ secrets.SSH_HOST_VPN4 }}
          API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
        run: |
          for p in claude-opus-5 gpt-5.6-terra; do
            echo "=== MODEL $p"
            for i in $(seq 1 8); do
              code=$(curl -s -o "/tmp/resp-$i.json" -w '%{http_code}' --max-time 120 \
                -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" \
                --data "{\"model\":\"$p\",\"max_tokens\":8,\"messages\":[{\"role\":\"user\",\"content\":\"reply OK only\"}]}" \
                "http://$HOST:28417/v1/chat/completions" || echo 000)
              echo "$p request-$i -> $code"
            done
          done
      - name: Snapshot counters and compute deltas
        env:
          HOST: ${{ secrets.SSH_HOST_VPN4 }}
          MGMT_KEY: ${{ secrets.CLIPROXY_MGMT_KEY }}
        run: |
          for p in claude codex; do
            curl -sf --max-time 20 -H "Authorization: Bearer $MGMT_KEY" "http://$HOST:28417/v8/management/auth-files?provider=$p" -o "/tmp/after-$p.json"
            echo "=== AFTER $p / DELTA"
            python3 - "$p" <<'PY'
          import json,sys
          provider=sys.argv[1]; before={x.get('id'):x for x in json.load(open(f'/tmp/before-{provider}.json')).get('files',[])}
          after=json.load(open(f'/tmp/after-{provider}.json')).get('files',[])
          for x in after:
              old=before.get(x.get('id'),{}); print(x.get('id'), x.get('name'), 'success=',x.get('success'), 'delta=',x.get('success',0)-old.get('success',0), 'failed_delta=',x.get('failed',0)-old.get('failed',0))
          PY
          done
