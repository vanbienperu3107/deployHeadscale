name: Deploy guarded Portainer (vpn4)

on:
  workflow_dispatch:

concurrency:
  group: deploy-vpn4-host
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Portainer without disturbing vpn4 workloads
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets without displaying values
        env:
          SSH_HOST_VPN4: ${{ secrets.SSH_HOST_VPN4 }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$SSH_HOST_VPN4" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::error::A required deployment secret is missing"
            exit 1
          fi

      - name: Validate Portainer DNS before connecting to vpn4
        env:
          SSH_HOST_VPN4: ${{ secrets.SSH_HOST_VPN4 }}
        run: |
          RESOLVED=$(python3 -c "import socket; print(socket.gethostbyname('portainer.hangocthanh.io.vn'))" 2>/dev/null || true)
          EXPECTED=$(python3 -c "import socket; print(socket.gethostbyname('$SSH_HOST_VPN4'))" 2>/dev/null || true)
          if [ -z "$RESOLVED" ] || [ -z "$EXPECTED" ] || [ "$RESOLVED" != "$EXPECTED" ]; then
            echo "::error::Portainer DNS does not resolve to the configured deployment host"
            exit 1
          fi

      - name: Stage Portainer and target-recreate only its edge routes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH,DEPLOY_REF
          script_stop: false
          command_timeout: 20m
          script: |
            set -euo pipefail
            SUDO="sudo -n"
            cd "$DEPLOY_PATH"
            TRANSACTION_DIR="$DEPLOY_PATH/.portainer-deploy-transaction"
            TRANSACTION_MARKER="$TRANSACTION_DIR/pending"
            $SUDO rm -rf "$TRANSACTION_DIR"
            $SUDO mkdir -p "$TRANSACTION_DIR"
            PREVIOUS_NGINX="$TRANSACTION_DIR/nginx.conf.previous"
            PREVIOUS_CADDY="$TRANSACTION_DIR/Caddyfile.previous"
            $SUDO cp edge-vpn4/nginx.conf "$PREVIOUS_NGINX"
            $SUDO cp edge-vpn4/Caddyfile "$PREVIOUS_CADDY"
            $SUDO touch "$TRANSACTION_MARKER"
            OLD_SHA=$(git rev-parse HEAD)
            printf '%s\n' "$OLD_SHA" | $SUDO tee "$TRANSACTION_DIR/old-sha" >/dev/null
            git fetch origin "$DEPLOY_REF:refs/remotes/origin/$DEPLOY_REF"
            git reset --hard "origin/$DEPLOY_REF"
            NEW_SHA=$(git rev-parse HEAD)
            echo "Deployment revision changed: $OLD_SHA -> $NEW_SHA"
            $SUDO docker network inspect edge >/dev/null 2>&1 || $SUDO docker network create edge
            $SUDO docker network inspect portainer_proxy >/dev/null 2>&1 || $SUDO docker network create portainer_proxy
            $SUDO docker run --rm -v "$DEPLOY_PATH/edge-vpn4/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
            $SUDO docker run --rm --add-host cliproxy:127.0.0.1 --add-host portainer:127.0.0.1 --add-host opencode-server:127.0.0.1 -v "$DEPLOY_PATH/edge-vpn4/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
            $SUDO docker compose --project-name portainer-vpn4 -f "$DEPLOY_PATH/portainer-vpn4/docker-compose.yml" config --quiet
            SNAPSHOT_BEFORE="$TRANSACTION_DIR/non-portainer.before"
            SNAPSHOT_AFTER="$TRANSACTION_DIR/non-portainer.after"
            snapshot_unrelated_workloads() { $SUDO docker ps --format '{{.Names}}' | while IFS= read -r container; do case "$container" in portainer|caddy-edge|edge-nginx) continue ;; esac; $SUDO docker inspect -f '{{.Name}}|{{.RestartCount}}|{{.State.StartedAt}}' "$container"; done | sed 's#^/##' | sort; }
            snapshot_non_portainer() { snapshot_unrelated_workloads; }
            snapshot_non_portainer | $SUDO tee "$SNAPSHOT_BEFORE" >/dev/null
            $SUDO docker compose --project-name portainer-vpn4 -f "$DEPLOY_PATH/portainer-vpn4/docker-compose.yml" pull portainer
            PORTAINER_STARTED=0
            EDGE_CHANGED=0
            PRE_PROXY_MEMBERS=$($SUDO docker network inspect portainer_proxy --format '{{range .Containers}}{{.Name}} {{end}}' | tr ' ' '\n' | sed '/^$/d; s#^/##' | sort | tr '\n' ' ')
            case "$PRE_PROXY_MEMBERS" in
              ""|"caddy-edge "|"caddy-edge portainer ") ;;
              *) echo "::error::portainer_proxy has an untrusted existing member"; exit 1 ;;
            esac
            $SUDO touch "$TRANSACTION_DIR/portainer-attempted"
            $SUDO docker compose --project-name portainer-vpn4 -f "$DEPLOY_PATH/portainer-vpn4/docker-compose.yml" up -d --remove-orphans portainer
            PORTAINER_STARTED=1
            PORTAINER_RUNNING=0
            for _ in $(seq 1 30); do if [ "$($SUDO docker inspect -f '{{.State.Running}}' portainer 2>/dev/null || true)" = "true" ]; then PORTAINER_RUNNING=1; break; fi; sleep 2; done
            test "$PORTAINER_RUNNING" = "1"
            $SUDO touch "$TRANSACTION_DIR/caddy-change-attempted"
            $SUDO docker compose -f "$DEPLOY_PATH/edge-vpn4/docker-compose.yml" up -d --force-recreate --no-deps caddy-edge
            $SUDO touch "$TRANSACTION_DIR/nginx-change-attempted"
            $SUDO docker compose -f "$DEPLOY_PATH/edge-vpn4/docker-compose.yml" up -d --force-recreate --no-deps nginx
            DERP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://vpn4.hangocthanh.io.vn/derp/probe || true)
            test "$DERP_CODE" = "200"
            STATUS_BODY=$(mktemp)
            STATUS_CODE=000
            for _ in $(seq 1 30); do STATUS_CODE=$(curl -sS -o "$STATUS_BODY" -w '%{http_code}' --max-time 20 https://portainer.hangocthanh.io.vn/api/status || true); if [ "$STATUS_CODE" = "200" ] && test -s "$STATUS_BODY"; then break; fi; sleep 5; done
            test "$STATUS_CODE" = "200"
            test -s "$STATUS_BODY"
            LISTENERS="$TRANSACTION_DIR/listeners"
            $SUDO ss -ltn | $SUDO tee "$LISTENERS" >/dev/null
            if $SUDO grep -Eq ':(8000|9000|9443)\b' "$LISTENERS"; then exit 1; fi
            test "$($SUDO docker inspect -f '{{json .HostConfig.PortBindings}}' portainer)" = "null"
            PORTAINER_NETWORKS=$($SUDO docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' portainer)
            test "$PORTAINER_NETWORKS" = "portainer_proxy "
            PROXY_MEMBERS=$($SUDO docker network inspect portainer_proxy --format '{{range .Containers}}{{.Name}} {{end}}' | tr ' ' '\n' | sed '/^$/d; s#^/##' | sort | tr '\n' ' ')
            test "$PROXY_MEMBERS" = "caddy-edge portainer "
            echo "Portainer image: $($SUDO docker image inspect --format '{{index .RepoDigests 0}}' portainer/portainer-ce:lts 2>/dev/null || echo portainer/portainer-ce:lts)"
            snapshot_non_portainer | $SUDO tee "$SNAPSHOT_AFTER" >/dev/null
            if ! $SUDO cmp -s "$SNAPSHOT_BEFORE" "$SNAPSHOT_AFTER"; then $SUDO diff -u "$SNAPSHOT_BEFORE" "$SNAPSHOT_AFTER" || true; exit 1; fi
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_REF: ${{ github.ref_name }}

      - name: Verify public TLS, authentication boundaries, and DERP externally
        run: |
          STATUS_BODY=$(mktemp)
          STATUS_CODE=$(curl -sS -o "$STATUS_BODY" -w '%{http_code}' --max-time 30 https://portainer.hangocthanh.io.vn/api/status || true)
          if [ "$STATUS_CODE" != "200" ] || ! test -s "$STATUS_BODY"; then
            echo "::error::Portainer public TLS readiness endpoint failed"
            exit 1
          fi
          DERP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://vpn4.hangocthanh.io.vn/derp/probe || true)
          if [ "$DERP_CODE" != "200" ]; then
            echo "::error::DERP public probe failed"
            exit 1
          fi
          CLIPROXY_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://cliproxy.hangocthanh.io.vn/v1/models || true)
          case "$CLIPROXY_CODE" in
            401|403) ;;
            *) echo "::error::CLIProxy authentication route regressed"; exit 1 ;;
          esac
          OPENCODE_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://opencode.hangocthanh.io.vn/global/health || true)
          if [ "$OPENCODE_CODE" != "401" ]; then
            echo "::error::OpenCode did not enforce unauthenticated HTTP 401"
            exit 1
          fi
          rm -f "$STATUS_BODY"

      - name: Collect Portainer failure diagnostics before rollback
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script_stop: false
          command_timeout: 5m
          script: |
            set +e
            SUDO="sudo -n"
            echo "==> Portainer state"
            $SUDO docker ps -a --filter "name=^/portainer$" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            $SUDO docker inspect -f 'state={{.State.Status}} running={{.State.Running}} networks={{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}} ports={{json .HostConfig.PortBindings}}' portainer
            echo "==> portainer_proxy members"
            $SUDO docker network inspect portainer_proxy --format '{{range .Containers}}{{.Name}} {{end}}'
            echo "==> Caddy log (200 lines)"
            $SUDO docker logs --tail 200 caddy-edge
            echo "==> Nginx log (100 lines)"
            $SUDO docker logs --tail 100 edge-nginx
            echo "==> Portainer log (100 lines)"
            $SUDO docker logs --tail 100 portainer 2>&1 | sed -E '/setup_token=|Paste it into the setup screen/d'

      - name: Rollback transaction if deployment or external verification failed
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script_stop: false
          command_timeout: 10m
          script: |
            set +e
            SUDO="sudo -n"
            TRANSACTION_DIR="$DEPLOY_PATH/.portainer-deploy-transaction"
            TRANSACTION_MARKER="$TRANSACTION_DIR/pending"
            ROLLBACK_FAILED=0
            rollback_run() { "$@" || ROLLBACK_FAILED=1; }
            $SUDO test -f "$TRANSACTION_MARKER" || exit 0
            OLD_SHA=$($SUDO cat "$TRANSACTION_DIR/old-sha")
            if $SUDO test -f "$TRANSACTION_DIR/caddy-change-attempted"; then
              rollback_run $SUDO cp "$TRANSACTION_DIR/Caddyfile.previous" "$DEPLOY_PATH/edge-vpn4/Caddyfile"
              rollback_run $SUDO docker compose -f "$DEPLOY_PATH/edge-vpn4/docker-compose.yml" up -d --force-recreate --no-deps caddy-edge
            fi
            if $SUDO test -f "$TRANSACTION_DIR/nginx-change-attempted"; then
              rollback_run $SUDO cp "$TRANSACTION_DIR/nginx.conf.previous" "$DEPLOY_PATH/edge-vpn4/nginx.conf"
              rollback_run $SUDO docker run --rm -v "$DEPLOY_PATH/edge-vpn4/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
              rollback_run $SUDO docker compose -f "$DEPLOY_PATH/edge-vpn4/docker-compose.yml" up -d --force-recreate --no-deps nginx
            fi
            if $SUDO test -f "$TRANSACTION_DIR/portainer-attempted"; then
              rollback_run $SUDO docker compose --project-name portainer-vpn4 -f "$DEPLOY_PATH/portainer-vpn4/docker-compose.yml" down
            fi
            rollback_run git reset --hard "$OLD_SHA"
            test "$ROLLBACK_FAILED" = "0" && $SUDO rm -rf "$TRANSACTION_DIR"
            test "$ROLLBACK_FAILED" = "0" || exit 1

      - name: Commit successful transaction cleanup
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script_stop: false
          command_timeout: 5m
          script: |
            set -euo pipefail
            SUDO="sudo -n"
            TRANSACTION_DIR="$DEPLOY_PATH/.portainer-deploy-transaction"
            test -d "$TRANSACTION_DIR" || exit 0
            $SUDO rm -rf "$TRANSACTION_DIR"
