name: Deploy guarded Portainer (vpn4)

on:
  workflow_dispatch:

concurrency:
  group: deploy-vpn4-host
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Portainer without disturbing vpn4 workloads
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets without displaying values
        env:
          SSH_HOST_VPN4: ${{ secrets.SSH_HOST_VPN4 }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$SSH_HOST_VPN4" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::error::A required deployment secret is missing"
            exit 1
          fi

      - name: Validate Portainer DNS before connecting to vpn4
        env:
          SSH_HOST_VPN4: ${{ secrets.SSH_HOST_VPN4 }}
        run: |
          RESOLVED=$(python3 -c "import socket; print(socket.gethostbyname('portainer.hangocthanh.io.vn'))" 2>/dev/null || true)
          EXPECTED=$(python3 -c "import socket; print(socket.gethostbyname('$SSH_HOST_VPN4'))" 2>/dev/null || true)
          if [ -z "$RESOLVED" ] || [ -z "$EXPECTED" ] || [ "$RESOLVED" != "$EXPECTED" ]; then
            echo "::error::Portainer DNS does not resolve to the configured deployment host"
            exit 1
          fi

      - name: Stage Portainer and target-recreate only its edge routes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH,DEPLOY_REF,PORTAINER_OAUTH_CLIENT_ID,PORTAINER_OAUTH_CLIENT_SECRET,PORTAINER_OAUTH_COOKIE_SECRET,PORTAINER_ADMIN_PASSWORD
          script_stop: false
          command_timeout: 20m
          script: |
            set -euo pipefail
            # KHONG dung `set -x`: script xu ly OAuth client secret, cookie secret
            # va mat khau admin; trace se in chung vao Actions log. ERR trap chi
            # in so dong + exit status, du de xac dinh loi ma khong lo credential.
            # KHONG dung ${LINENO}: drone-ssh viet lai script truoc khi chay nen so
            # dong khong khop voi file trong repo (run 40949091264 bao "line 82" —
            # mot dong COMMENT). $BASH_COMMAND la lenh THAT dang chay.
            #
            # $BASH_COMMAND da duoc EXPAND, nen neu lenh loi la printf ghi secret
            # thi gia tri that se lot vao log. Loc qua sed truoc khi in, va chi
            # giu 200 ky tu dau.
            # Loc bang Python voi so khop LITERAL: secret co the chua ky tu dac
            # biet cua regex (sed se hieu sai va bo sot).
            report_failed_command() { FAILED_STATUS="$1" FAILED_COMMAND="$2" python3 -c 'import os; cmd=os.environ["FAILED_COMMAND"]; [cmd := cmd.replace(v, "REDACTED") for v in (os.environ.get(n) or "" for n in ("PORTAINER_OAUTH_CLIENT_SECRET", "PORTAINER_OAUTH_COOKIE_SECRET", "PORTAINER_ADMIN_PASSWORD", "PORTAINER_OAUTH_CLIENT_ID")) if v]; print("::error::Portainer stage failed (exit " + os.environ["FAILED_STATUS"] + ") at: " + cmd[:200])' >&2; }
            trap 'report_failed_command "$?" "$BASH_COMMAND"' ERR
            SUDO="sudo -n"
            cd "$DEPLOY_PATH"
            TRANSACTION_DIR="$DEPLOY_PATH/.portainer-deploy-transaction"
            TRANSACTION_MARKER="$TRANSACTION_DIR/pending"
            $SUDO rm -rf "$TRANSACTION_DIR"
            $SUDO mkdir -p "$TRANSACTION_DIR"
            PREVIOUS_NGINX="$TRANSACTION_DIR/nginx.conf.previous"
            PREVIOUS_CADDY="$TRANSACTION_DIR/Caddyfile.previous"
            $SUDO cp edge-vpn4/nginx.conf "$PREVIOUS_NGINX"
            $SUDO cp edge-vpn4/Caddyfile "$PREVIOUS_CADDY"
            $SUDO touch "$TRANSACTION_MARKER"
            OLD_SHA=$(git rev-parse HEAD)
            printf '%s\n' "$OLD_SHA" | $SUDO tee "$TRANSACTION_DIR/old-sha" >/dev/null
            git fetch origin "$DEPLOY_REF:refs/remotes/origin/$DEPLOY_REF"
            git reset --hard "origin/$DEPLOY_REF"
            NEW_SHA=$(git rev-parse HEAD)
            echo "Deployment revision changed: $OLD_SHA -> $NEW_SHA"
            $SUDO docker network inspect edge >/dev/null 2>&1 || $SUDO docker network create edge
            $SUDO docker network inspect portainer_proxy >/dev/null 2>&1 || $SUDO docker network create portainer_proxy
            $SUDO docker run --rm -v "$DEPLOY_PATH/edge-vpn4/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
            $SUDO docker run --rm --add-host cliproxy:127.0.0.1 --add-host portainer:127.0.0.1 --add-host portainer-oauth2-proxy:127.0.0.1 --add-host opencode-server:127.0.0.1 -v "$DEPLOY_PATH/edge-vpn4/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
            test -n "$PORTAINER_OAUTH_CLIENT_ID" && test -n "$PORTAINER_OAUTH_CLIENT_SECRET" && test -n "$PORTAINER_OAUTH_COOKIE_SECRET" && test -n "$PORTAINER_ADMIN_PASSWORD"
            umask 077
            mkdir -p "$DEPLOY_PATH/portainer-vpn4/secrets"
            printf 'OAUTH2_PROXY_CLIENT_ID=%s\n' "$PORTAINER_OAUTH_CLIENT_ID" > "$DEPLOY_PATH/portainer-vpn4/secrets/oauth2.env"
            printf 'OAUTH2_PROXY_CLIENT_SECRET=%s\n' "$PORTAINER_OAUTH_CLIENT_SECRET" >> "$DEPLOY_PATH/portainer-vpn4/secrets/oauth2.env"
            printf 'OAUTH2_PROXY_COOKIE_SECRET=%s\n' "$PORTAINER_OAUTH_COOKIE_SECRET" >> "$DEPLOY_PATH/portainer-vpn4/secrets/oauth2.env"
            printf '%s' "$PORTAINER_ADMIN_PASSWORD" > "$DEPLOY_PATH/portainer-vpn4/secrets/admin-password"
            chmod 600 "$DEPLOY_PATH/portainer-vpn4/secrets/oauth2.env" "$DEPLOY_PATH/portainer-vpn4/secrets/admin-password"
            $SUDO docker compose --project-name portainer-vpn4 -f "$DEPLOY_PATH/portainer-vpn4/docker-compose.yml" config --quiet
            SNAPSHOT_BEFORE="$TRANSACTION_DIR/non-portainer.before"
            SNAPSHOT_AFTER="$TRANSACTION_DIR/non-portainer.after"
            snapshot_unrelated_workloads() { $SUDO docker ps --format '{{.Names}}' | while IFS= read -r container; do case "$container" in portainer|portainer-oauth2-proxy|caddy-edge|edge-nginx) continue ;; esac; $SUDO docker inspect -f '{{.Name}}|{{.RestartCount}}|{{.State.StartedAt}}' "$container"; done | sed 's#^/##' | sort; }
            snapshot_non_portainer() { snapshot_unrelated_workloads; }
            snapshot_non_portainer | $SUDO tee "$SNAPSHOT_BEFORE" >/dev/null
            $SUDO docker compose --project-name portainer-vpn4 -f "$DEPLOY_PATH/portainer-vpn4/docker-compose.yml" pull
            PORTAINER_STARTED=0
            EDGE_CHANGED=0
            PRE_PROXY_MEMBERS=$($SUDO docker network inspect portainer_proxy --format '{{range .Containers}}{{.Name}} {{end}}' | tr ' ' '\n' | sed '/^$/d; s#^/##' | sort | tr '\n' ' ')
            case "$PRE_PROXY_MEMBERS" in
              ""|"caddy-edge "|"caddy-edge portainer "|"caddy-edge portainer portainer-oauth2-proxy "|"caddy-edge portainer-oauth2-proxy ") ;;
              *) echo "::error::portainer_proxy has an untrusted existing member"; exit 1 ;;
            esac
            $SUDO touch "$TRANSACTION_DIR/portainer-attempted"
            $SUDO docker compose --project-name portainer-vpn4 -f "$DEPLOY_PATH/portainer-vpn4/docker-compose.yml" up -d --remove-orphans
            PORTAINER_STARTED=1
            PORTAINER_RUNNING=0
            for _ in $(seq 1 30); do if [ "$($SUDO docker inspect -f '{{.State.Running}}' portainer 2>/dev/null || true)" = "true" ]; then PORTAINER_RUNNING=1; break; fi; sleep 2; done
            test "$PORTAINER_RUNNING" = "1"
            GATE_RUNNING=0
            for _ in $(seq 1 30); do if [ "$($SUDO docker inspect -f '{{.State.Running}}' portainer-oauth2-proxy 2>/dev/null || true)" = "true" ]; then GATE_RUNNING=1; break; fi; sleep 2; done
            test "$GATE_RUNNING" = "1"
            $SUDO touch "$TRANSACTION_DIR/caddy-change-attempted"
            $SUDO docker compose -f "$DEPLOY_PATH/edge-vpn4/docker-compose.yml" up -d --force-recreate --no-deps caddy-edge
            $SUDO touch "$TRANSACTION_DIR/nginx-change-attempted"
            $SUDO docker compose -f "$DEPLOY_PATH/edge-vpn4/docker-compose.yml" up -d --force-recreate --no-deps nginx
            probe_code() { set +e; curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$1"; set -e; }
            wait_for_code() { TARGET="$1"; URL="$2"; ATTEMPTS="$3"; DELAY="$4"; LAST=000; for _ in $(seq 1 "$ATTEMPTS"); do LAST=$(probe_code "$URL"); if [ "$LAST" = "$TARGET" ]; then break; fi; sleep "$DELAY"; done; printf '%s' "$LAST"; }
            DERP_CODE=$(wait_for_code 200 https://vpn4.hangocthanh.io.vn/derp/probe 15 4)
            test "$DERP_CODE" = "200"
            STATUS_CODE=$(wait_for_code 302 https://portainer.hangocthanh.io.vn/api/status 30 5)
            test "$STATUS_CODE" = "302"
            LOGIN_LOCATION=$(set +e; curl -sS -D - -o /dev/null --max-time 20 https://portainer.hangocthanh.io.vn/api/status | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
            case "$LOGIN_LOCATION" in
              */oauth2/start*) ;;
              *) echo "::error::unauthenticated traffic was not redirected to the SSO gate (Location=${LOGIN_LOCATION:-<empty>})"; exit 1 ;;
            esac
            LISTENERS="$TRANSACTION_DIR/listeners"
            $SUDO ss -ltn | $SUDO tee "$LISTENERS" >/dev/null
            if $SUDO grep -Eq ':(8000|9000|9443)\b' "$LISTENERS"; then exit 1; fi
            # Docker tra "{}" (object rong) khi khong co port binding, chi tra
            # "null" trong mot so phien ban/ngu canh khac. Assertion cu chi chap
            # nhan "null" -> deploy that bai du Portainer KHONG publish port nao
            # (run 40950665989: ports={}). Chap nhan ca hai dang rong, va van
            # chan bat ky binding that nao.
            PORTAINER_BINDINGS=$($SUDO docker inspect -f '{{json .HostConfig.PortBindings}}' portainer)
            case "$PORTAINER_BINDINGS" in
              null|"{}") ;;
              *) echo "::error::Portainer must not publish host ports: $PORTAINER_BINDINGS"; exit 1 ;;
            esac
            GATE_BINDINGS=$($SUDO docker inspect -f '{{json .HostConfig.PortBindings}}' portainer-oauth2-proxy)
            case "$GATE_BINDINGS" in
              null|"{}") ;;
              *) echo "::error::SSO gate must not publish host ports: $GATE_BINDINGS"; exit 1 ;;
            esac
            PORTAINER_NETWORKS=$($SUDO docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' portainer)
            test "$PORTAINER_NETWORKS" = "portainer_proxy "
            GATE_NETWORKS=$($SUDO docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' portainer-oauth2-proxy)
            test "$GATE_NETWORKS" = "portainer_proxy "
            # Docker khong cam ket thu tu .Containers va drone-ssh chen guard sau
            # moi dong script; tranh helper/pipeline shell o day. Docker tra JSON,
            # Python doi chieu theo TAP HOP va luon in 0/1 (khong de exit status
            # cua sort/pipeline lam chet ca transaction).
            # Cho Docker cap nhat attachment cua Caddy sau recreate. Khong dung
            # loop shell o top-level: drone-ssh chen exit guard moi dong, de
            # status trung gian cua loop lam fail sai transaction.
            sleep 3
            PROXY_JSON=$($SUDO docker network inspect portainer_proxy --format '{{json .Containers}}')
            PROXY_OK=$(PROXY_JSON="$PROXY_JSON" python3 -c 'import json, os; expected={"caddy-edge", "portainer", "portainer-oauth2-proxy"}; actual={item["Name"] for item in json.loads(os.environ["PROXY_JSON"]).values()}; print(int(actual == expected))')
            test "$PROXY_OK" = "1"
            echo "Portainer image: $($SUDO docker image inspect --format '{{index .RepoDigests 0}}' portainer/portainer-ce:lts 2>/dev/null || echo portainer/portainer-ce:lts)"
            snapshot_non_portainer | $SUDO tee "$SNAPSHOT_AFTER" >/dev/null
            if ! $SUDO cmp -s "$SNAPSHOT_BEFORE" "$SNAPSHOT_AFTER"; then $SUDO diff -u "$SNAPSHOT_BEFORE" "$SNAPSHOT_AFTER" || true; exit 1; fi
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_REF: ${{ github.ref_name }}
          PORTAINER_OAUTH_CLIENT_ID: ${{ secrets.PORTAINER_OAUTH_CLIENT_ID }}
          PORTAINER_OAUTH_CLIENT_SECRET: ${{ secrets.PORTAINER_OAUTH_CLIENT_SECRET }}
          PORTAINER_OAUTH_COOKIE_SECRET: ${{ secrets.PORTAINER_OAUTH_COOKIE_SECRET }}
          PORTAINER_ADMIN_PASSWORD: ${{ secrets.PORTAINER_ADMIN_PASSWORD }}

      - name: Verify public TLS, authentication boundaries, and DERP externally
        run: |
          set +e
          # curl thoat != 0 trong nhieu truong hop hop le (TLS alert, redirect
          # chain). Tat errexit roi kiem tra tung ma mot cach tuong minh.
          STATUS_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://portainer.hangocthanh.io.vn/api/status)
          # Caddy tra Location TUONG DOI ("/oauth2/start?rd=..."). curl chi dien
          # %{redirect_url} khi no THUC SU di theo redirect (-L); khong co -L thi
          # bien do RONG -> kiem tra se bao sai (run 40895576406). Doc thang header.
          REDIRECT_TO=$(curl -sS -D - -o /dev/null --max-time 30 https://portainer.hangocthanh.io.vn/api/status | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
          DERP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://vpn4.hangocthanh.io.vn/derp/probe)
          CLIPROXY_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://cliproxy.hangocthanh.io.vn/v1/models)
          OPENCODE_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://opencode.hangocthanh.io.vn/global/health)
          echo "portainer=$STATUS_CODE derp=$DERP_CODE cliproxy=$CLIPROXY_CODE opencode=$OPENCODE_CODE"
          FAILED=0
          # 302 toi /oauth2/start la BANG CHUNG cong SSO dang chan. Neu Portainer
          # tra 200 truc tiep thi lop bao ve da bien mat -> fail deploy.
          if [ "$STATUS_CODE" != "302" ]; then
            echo "::error::Portainer answered $STATUS_CODE without SSO; expected a 302 to the login gate"
            FAILED=1
          fi
          case "$REDIRECT_TO" in
            */oauth2/start*) ;;
            *) echo "::error::unauthenticated request was not sent to the SSO gate: $REDIRECT_TO"; FAILED=1 ;;
          esac
          test "$DERP_CODE" = "200" || { echo "::error::DERP public probe failed: $DERP_CODE"; FAILED=1; }
          case "$CLIPROXY_CODE" in
            401|403) ;;
            *) echo "::error::CLIProxy authentication route regressed: $CLIPROXY_CODE"; FAILED=1 ;;
          esac
          test "$OPENCODE_CODE" = "401" || { echo "::error::OpenCode did not enforce 401: $OPENCODE_CODE"; FAILED=1; }
          exit "$FAILED"

      - name: Collect Portainer failure diagnostics before rollback
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script_stop: false
          command_timeout: 5m
          script: |
            set +e
            SUDO="sudo -n"
            echo "==> Portainer state"
            $SUDO docker ps -a --filter "name=^/portainer$" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            $SUDO docker inspect -f 'state={{.State.Status}} running={{.State.Running}} networks={{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}} ports={{json .HostConfig.PortBindings}}' portainer
            echo "==> portainer_proxy members"
            $SUDO docker network inspect portainer_proxy --format '{{range .Containers}}{{.Name}} {{end}}'
            echo "==> Caddy log (200 lines)"
            $SUDO docker logs --tail 200 caddy-edge
            echo "==> Nginx log (100 lines)"
            $SUDO docker logs --tail 100 edge-nginx
            echo "==> Portainer log (100 lines)"
            $SUDO docker logs --tail 100 portainer 2>&1 | sed -E '/setup_token=|Paste it into the setup screen/d'
            echo "==> SSO gate log (60 lines)"
            $SUDO docker logs --tail 60 portainer-oauth2-proxy 2>&1 | sed -E 's/(client_secret|cookie-secret)=[^ ]*/\1=REDACTED/g'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Rollback transaction if deployment or external verification failed
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script_stop: false
          command_timeout: 10m
          script: |
            set +e
            SUDO="sudo -n"
            test -n "$DEPLOY_PATH" || { echo "::error::DEPLOY_PATH is empty; refusing to skip rollback"; exit 1; }
            cd "$DEPLOY_PATH" || { echo "::error::cannot enter DEPLOY_PATH; refusing to continue"; exit 1; }
            TRANSACTION_DIR="$DEPLOY_PATH/.portainer-deploy-transaction"
            TRANSACTION_MARKER="$TRANSACTION_DIR/pending"
            ROLLBACK_FAILED=0
            rollback_run() { "$@" || ROLLBACK_FAILED=1; }
            $SUDO test -f "$TRANSACTION_MARKER" || exit 0
            OLD_SHA=$($SUDO cat "$TRANSACTION_DIR/old-sha")
            if $SUDO test -f "$TRANSACTION_DIR/caddy-change-attempted"; then
              rollback_run $SUDO cp "$TRANSACTION_DIR/Caddyfile.previous" "$DEPLOY_PATH/edge-vpn4/Caddyfile"
              rollback_run $SUDO docker compose -f "$DEPLOY_PATH/edge-vpn4/docker-compose.yml" up -d --force-recreate --no-deps caddy-edge
            fi
            if $SUDO test -f "$TRANSACTION_DIR/nginx-change-attempted"; then
              rollback_run $SUDO cp "$TRANSACTION_DIR/nginx.conf.previous" "$DEPLOY_PATH/edge-vpn4/nginx.conf"
              rollback_run $SUDO docker run --rm -v "$DEPLOY_PATH/edge-vpn4/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
              rollback_run $SUDO docker compose -f "$DEPLOY_PATH/edge-vpn4/docker-compose.yml" up -d --force-recreate --no-deps nginx
            fi
            if $SUDO test -f "$TRANSACTION_DIR/portainer-attempted"; then
              rollback_run $SUDO docker compose --project-name portainer-vpn4 -f "$DEPLOY_PATH/portainer-vpn4/docker-compose.yml" down
            fi
            rollback_run git reset --hard "$OLD_SHA"
            test "$ROLLBACK_FAILED" = "0" && $SUDO rm -rf "$TRANSACTION_DIR"
            test "$ROLLBACK_FAILED" = "0" || exit 1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Commit successful transaction cleanup
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script_stop: false
          command_timeout: 5m
          script: |
            set -euo pipefail
            SUDO="sudo -n"
            test -n "$DEPLOY_PATH"
            TRANSACTION_DIR="$DEPLOY_PATH/.portainer-deploy-transaction"
            test -d "$TRANSACTION_DIR" || exit 0
            $SUDO rm -rf "$TRANSACTION_DIR"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
