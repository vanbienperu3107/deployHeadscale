name: Reset CLIProxy cooldowns (claude + codex)

# Xoa cooldown dinh dan quyt tai PROXY cho moi credential claude + codex.
#
# Vi sao can tay nghia nay: reset-quota cua management CHI xoa trang thai
# cooldown ben proxy (Quota/ModelState), KHONG lam sinh quota thuong nguon.
# Sau reset phai probe lai de phan biet:
#   - 200 = cooldown la HOAI (bug proxy) -> run chay dung.
#   - 429 usage_limit_reached = quota upstream THAT. Chot 2026-10-22 (run
#     39814322604): codex plan prolite window 7 ngay, reset_in_seconds
#     399685s = 111.0h — khop chinh xac reset_time 111h cua cooldown proxy.
#     Nghia la khong phai bug v7.2.149; do la quota thuc, phai cho cua so quota.
# Truoc do nghi v7.2.149 nhieu Retry-After ngan thanh cooldown gio; v8
# db1bab01 chua rieng cho claude per-minute — van dung lam tham khao.
#

# Chay thu cong + tu dong:
# - 03:00 UTC hang ngay: sau 2026-10-27 hay ~27-28/10 (4.6 ngay tu 22/10)
#   cua so quota codex/claude ma run 39814322604 phat hien se het; run nay se
#   tu xac nhan probe gpt-5.6-terra 200 that (issue #148: doi chieu truoc/sau
#   khi nang v8).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: deploy-vpn4-host
  cancel-in-progress: false

jobs:
  reset:
    name: Reset cooldowns (claude + codex) + probe
    runs-on: ubuntu-latest
    steps:
      # Neu plugin fallback DANG soong tren config live (xem test_*) thi dong bo
      # fallback_models. Doi so khop template: gpt-5.5/gpt-5.4 da bi OpenAI rut
      # khoi catalog Codex — dieu tra run 39804597093 xac nhan /v1/models con
      # gpt-5.6-terra cung khong con gpt-5.5 su thuc dang vao cap quay ngang do.
      - name: Dong bo config fallback (model-fallback-router)
        env:
          BASE_URL: https://cliproxy.hangocthanh.io.vn
          MGMT_KEY: ${{ secrets.CLIPROXY_MGMT_KEY }}
        run: |
          test -n "$MGMT_KEY"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $MGMT_KEY" "$BASE_URL/v0/management/plugins/model-fallback-router/config" || true); CODE=${CODE:-000}
          echo "GET plugins/model-fallback-router/config -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Plugin khong chay o config live -> bo qua chung minh doi nua template khong thua hai tac du nhu lan deploy nay doi template da thay."
            exit 0
          fi
          DATA='{"enabled":true,"priority":100,"rules":[{"name":"claude_rate_limit_fallback","source_formats":["claude","anthropic","openai","chat-completions"],"models":["claude-*"],"primary_model":"$requested","fallback_models":["gpt-5.6-terra"]}],"fallback":{"enabled":true,"cooldown_seconds":300,"fallback_on_status":[401,403,408,409,429,500,502,503,504],"no_fallback_on_status":[400,404,422]}}'
          PUT_CODE=$(curl -sS -o /tmp/put.json -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $MGMT_KEY" -H "Content-Type: application/json" --data "$DATA" "$BASE_URL/v0/management/plugins/model-fallback-router/config" || true); PUT_CODE=${PUT_CODE:-000}
          echo "PUT plugins/model-fallback-router/config -> HTTP $PUT_CODE"
          if [ "$PUT_CODE" != "200" ]; then
            # KHONG fatal: config live da co plugin (GET 200 o tren) va template
            # deploy la nguon on dinh. Run 39814322604: PUT 400 lam run DO oan
            # du plugin van sync tu template du. Ghi lai body de chuan doan.
            echo "::warning::PUT plugin config HTTP $PUT_CODE — khong chan, xem body"
            head -c 600 /tmp/put.json; echo
          else
            curl -fsS --max-time 30 -H "Authorization: Bearer $MGMT_KEY" "$BASE_URL/v0/management/plugins/model-fallback-router/config" | python3 -c "import json,sys;d=json.load(sys.stdin);print('live fallback_models =',d.get('rules',[{}])[0].get('fallback_models'))"
          fi

      - name: Reset moi credential claude + codex
        env:
          BASE_URL: https://cliproxy.hangocthanh.io.vn
          MGMT_KEY: ${{ secrets.CLIPROXY_MGMT_KEY }}
        run: |
          test -n "$MGMT_KEY"
          curl -fsS --max-time 30 -H "Authorization: Bearer $MGMT_KEY" "$BASE_URL/v0/management/auth-files" -o /tmp/auth-files.json
          python3 -c "import json;d=json.load(open('/tmp/auth-files.json'));xs=[(x['auth_index'],x['provider']) for x in d.get('files',[]) if str(x.get('provider','')).lower() in ('claude','codex') and x.get('auth_index')];open('/tmp/indexes','w').write(''.join('%s %s\n'%(p,i) for (i,p) in xs));print('Claude+Codex credentials:',len(xs))"
          test -s /tmp/indexes
          echo "--- trang thai truoc reset ---"
          python3 -c "import json;d=json.load(open('/tmp/auth-files.json'));print('\n'.join('%-10s %-14s %s'%(x.get('provider'),x.get('status',''),x.get('label','')) for x in d.get('files',[]) if str(x.get('provider','')).lower() in ('claude','codex')))"
          while IFS=' ' read -r PROVIDER AUTH_INDEX; do
            test -n "$AUTH_INDEX" || continue
            python3 -c "import json,sys;open('/tmp/reset.json','w').write(json.dumps({'auth_index':sys.argv[1]}))" "$AUTH_INDEX"
            echo "[$PROVIDER] reset $AUTH_INDEX:"
            curl -fsS --max-time 30 -H "Authorization: Bearer $MGMT_KEY" -H "Content-Type: application/json" --data-binary @/tmp/reset.json "$BASE_URL/v0/management/reset-quota"
            echo
          done < /tmp/indexes
          echo "--- trang thai sau reset (doc lai tu API) ---"
          curl -fsS --max-time 30 -H "Authorization: Bearer $MGMT_KEY" "$BASE_URL/v0/management/auth-files" -o /tmp/auth-after.json
          python3 -c "import json;d=json.load(open('/tmp/auth-after.json'));print('\n'.join('%-10s %-14s %s'%(x.get('provider'),x.get('status',''),x.get('label','')) for x in d.get('files',[]) if str(x.get('provider','')).lower() in ('claude','codex')))"

      # Ket qua run 39810529521 (2026-10-22): sau reset-quota, codex error ->
      # active ben proxy, nhung request dau tien van bi upstream tra
      # "usage_limit reached" THAT (khong phai cooldown proxy) va lan goi sau
      # do cooldown gan: gpt-6-sol van 429, reset_time ~111h la noi suy cua
      # v7.2.149. Do vay gpt-6-sol CHI de thong tin.
      # Gate "codex song" la gpt-5.6-terra — model codex duy nhat con trong
      # catalog (/v1/models, chay diag 39804597093) khong dan vao bang dung luong.
      - name: Probe gpt-5.6-terra (codex song; usage limit thuong nguon KHONG DO)
        env:
          BASE_URL: https://cliproxy.hangocthanh.io.vn
          API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
        run: |
          test -n "$API_KEY"
          CODE=000
          for i in 1 2 3; do
            CODE=$(curl -sS -o /tmp/probe.json -w '%{http_code}' --max-time 90 -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" --data '{"model":"gpt-5.6-terra","max_tokens":8,"messages":[{"role":"user","content":"Reply OK"}]}' "$BASE_URL/v1/chat/completions")
            echo "gpt-5.6-terra -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then break; fi
            python3 -c "import json;e=json.load(open('/tmp/probe.json')).get('error',{});print('error:',e.get('message',''),'| reset_time:',e.get('reset_time','?'))" 2>/dev/null || head -c 300 /tmp/probe.json
            # usage_limit_reached = trang thai THUONG NGUON that (run
            # 39814322604: window 7 ngay plan prolite, con khoang ~110-111h).
            # Proxy khong nao sua duoc; deploy cau truc con phan hoi dung JSON
            # loi chuan. Khong coi la loi deploy.
            if grep -q 'usage_limit_reached' /tmp/probe.json 2>/dev/null; then
              echo "::warning::Quota codex thuong nguon het — proxy cau truc OK, doi cua so quota (~4 ngay)"
              exit 0
            fi
            sleep 20
          done
          test "$CODE" = "200"

      # Chi doc trang thai; khong lam run fail.
      - name: Probe gpt-6-sol (thong tin usage limit upstream)
        env:
          BASE_URL: https://cliproxy.hangocthanh.io.vn
          API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
        run: |
          test -n "$API_KEY"
          CODE=$(curl -sS -o /tmp/probe-sol.json -w '%{http_code}' --max-time 90 -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" --data '{"model":"gpt-6-sol","max_tokens":8,"messages":[{"role":"user","content":"Reply OK"}]}' "$BASE_URL/v1/chat/completions")
          echo "gpt-6-sol -> HTTP $CODE (informational)"
          python3 -c "import json;d=json.load(open('/tmp/probe-sol.json'));e=d.get('error',{});print('content:',(d.get('choices',[{}])[0].get('message',{}) or {}).get('content') or e.get('message',''),'| reset_time:',e.get('reset_time','?'))" || true

      # Chi doc trang thai: claude van co the o tren doan van la doan co ly do.
      - name: Probe claude-opus-5-5 (thong tin)
        env:
          BASE_URL: https://cliproxy.hangocthanh.io.vn
          API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
        run: |
          test -n "$API_KEY"
          CODE=$(curl -sS -o /tmp/probe-claude.json -w '%{http_code}' --max-time 90 -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" --data '{"model":"claude-opus-5-5","max_tokens":8,"messages":[{"role":"user","content":"Reply OK"}]}' "$BASE_URL/v1/chat/completions")
          echo "claude-opus-5-5 -> HTTP $CODE"
          python3 -c "import json;d=json.load(open('/tmp/probe-claude.json'));m=d.get('choices',[{}])[0].get('message',{});print('content:',m.get('content') or d.get('error',{}).get('message',''))" || true
