name: Verify GatePro login and OTP (vpn4, no firewall mutation)

# Chi login + email OTP + status. KHONG goi nodes/CR/connections, KHONG mo/dong firewall.
on:
  workflow_dispatch:

concurrency:
  group: deploy-vpn4-host
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: vpn4 - login GatePro va kiem tra session OTP
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: false
          command_timeout: 10m
          script: |
            set -eu
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo -n"; else SUDO=""; fi
            ROOT=/srv/gatepro
            test -f "$ROOT/docker-compose.yml" || { echo "::error::GatePro compose chua duoc deploy"; exit 1; }
            cd "$ROOT"
            DC="$SUDO docker compose --project-name gatepro-vpn4 -f $ROOT/docker-compose.yml"
            # Lock theo service logic: login doc mailbox OTP va chi luu session ma hoa trong DB.
            # Khong co command firewall trong workflow nay.
            $DC run --rm --no-deps -T --entrypoint gatepro gatepro login
            STATUS=$($DC run --rm --no-deps -T --entrypoint gatepro gatepro --json status)
            printf '%s\n' "$STATUS" | grep -q '"otp_verified": true' || {
              echo "::error::session chua otp_verified"
              exit 1
            }
            printf '%s\n' "$STATUS" | grep -v -iE 'session_id|password|token'
