name: Verify GatePro full flow (vpn4 API)

# status -> login/OTP (chi khi session het han) -> search -> CR -> ensure-open:
#   node dang MO  -> dong lai roi mo lai
#   node dang DONG -> mo luon
# close_after=true: dong lai sau khi test (khong de policy ton tai).
on:
  workflow_dispatch:
    inputs:
      node:
        description: "Node code/IP, nhieu node cach nhau dau phay, hoac ALL. Trong = chi login + search."
        required: false
        default: ""
      open_firewall:
        description: "Ensure-open firewall cho node"
        type: boolean
        default: false
      close_after:
        description: "Dong firewall sau khi test"
        type: boolean
        default: false

concurrency:
  group: deploy-vpn4-host
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: vpn4 - full flow qua API GatePro
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: GATEPRO_API_PASSWORD,NODE,OPEN_FW,CLOSE_AFTER
          script_stop: false
          command_timeout: 40m
          script: |
            set -u
            API=http://100.64.0.4:8080
            redact() { sed -E 's/("(session_id|sessionId|token|access_token|password[a-z_]*|otp_token|passwordAuth)"[[:space:]]*:[[:space:]]*)"[^"]*"/\1"***"/g' | head -c 2500; echo; }
            call() { M=$1; P=$2; D=${3:-}
              if [ -n "$D" ]; then OUT=$(curl -sS --max-time 400 -X "$M" "$API$P" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$D" -w '\nHTTP=%{http_code}')
              else OUT=$(curl -sS --max-time 400 -X "$M" "$API$P" -H "Authorization: Bearer $TOKEN" -w '\nHTTP=%{http_code}'); fi
              echo "---- $M $P"; printf '%s\n' "$OUT" | redact; }
            # trang thai node trong gatepro_connection: open | closed | none
            node_state() { curl -sS "$API/connections" -H "Authorization: Bearer $TOKEN" | python3 -c '
            import json,sys; n=sys.argv[1]; rows=[r for r in json.load(sys.stdin).get("connections",[]) if r.get("node_code")==n]
            print(rows[0]["status"] if rows else "none")' "$NODE"; }
            ok_or_die() { printf '%s' "$OUT" | grep -q '"ok": *true' && return 0; echo "::warning::$NODE: $1"; FAILED="$FAILED $NODE"; return 1; }
            TOKEN=$(curl -fsS -X POST "$API/auth/token" -H 'Content-Type: application/json' \
              -d "{\"username\":\"cms\",\"password\":\"$GATEPRO_API_PASSWORD\"}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])') \
              || { echo "::error::khong lay duoc token API"; exit 1; }

            echo "== 1. session"
            S=$(curl -sS "$API/status" -H "Authorization: Bearer $TOKEN")
            if printf '%s' "$S" | grep -q '"usable": *true' && printf '%s' "$S" | grep -q '"otp_verified": *true'; then
              echo "session con hieu luc -> KHONG login lai (khong gui OTP)"
            else
              echo "== 2. login + OTP"; call POST /login '{}'
            fi
            S=$(curl -sS "$API/status" -H "Authorization: Bearer $TOKEN")
            printf '%s' "$S" | grep -q '"otp_verified": *true' || { echo "::error::session chua otp_verified"; exit 1; }
            echo "session OK: $(printf '%s' "$S" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d["username"], int(d["seconds_remaining"]),"s")')"

            Q="$NODE"; case "$NODE" in ALL|*,*) Q="";; esac
            echo "== 3. search node"; call GET "/nodes?q=${Q}"
            echo "== 3b. bang tong hop node (GatePro) + trang thai firewall (DB)"
            N=$(curl -sS --max-time 400 "$API/nodes?q=${Q}" -H "Authorization: Bearer $TOKEN")
            C=$(curl -sS --max-time 120 "$API/connections?all=true" -H "Authorization: Bearer $TOKEN")
            NODES_JSON="$N" CONN_JSON="$C" python3 -c '
            import json,os
            n=json.loads(os.environ["NODES_JSON"]); c=json.loads(os.environ["CONN_JSON"]).get("connections",[])
            st={r["node_code"]:r for r in c}
            seen={}
            for it in n.get("items",[]):
                d=seen.setdefault(it["exchangeCode"],{"name":it["exchangeName"],"ip":it["exchangeIp"],"lines":[]})
                d["lines"].append(it["connectionTypeCode"])
            print("%-14s %-14s %-15s %-22s %-7s %-26s %s"%("CODE","NAME","IP","LINES","FW","EXPIRES","RENEW"))
            for code,d in sorted(seen.items()):
                r=st.get(code,{})
                print("%-14s %-14s %-15s %-22s %-7s %-26s %s"%(code,d["name"],d["ip"],",".join(d["lines"]),r.get("status","-"),(r.get("expires_at") or "-")[:25],r.get("renew_count","-")))
            print("TONG: %d node, %d dang open"%(len(seen),sum(1 for r in c if r.get("status")=="open")))
            '
            [ -n "$NODE" ] || { echo "FULL FLOW OK"; exit 0; }
            if [ "$NODE" = "ALL" ]; then
              LIST=$(NODES_JSON="$N" python3 -c 'import json,os;print(" ".join(sorted({i["exchangeCode"] for i in json.loads(os.environ["NODES_JSON"]).get("items",[])})))')
            else
              LIST=$(printf '%s' "$NODE" | tr ',' ' ')
            fi
            FAILED=""; OKS=""
            for NODE in $LIST; do
            echo "################ $NODE"
            echo "== 4. CR cua $NODE"; call GET "/nodes/$NODE/crs"
            [ "$OPEN_FW" = "true" ] || continue

            BEFORE=$(node_state); echo "== 5. trang thai truoc: $BEFORE"
            if [ "$BEFORE" = "open" ]; then
              echo "== 6a. dang MO -> dong lai"; call DELETE "/connections/$NODE"; ok_or_die "dong firewall that bai" || continue
              MID=$(node_state); echo "trang thai sau dong: $MID"
              [ "$MID" = "open" ] && { echo "::warning::$NODE dong xong van con open"; FAILED="$FAILED $NODE"; continue; }
            fi
            echo "== 6b. mo firewall $NODE"; call POST /connections "{\"nodes\":[\"$NODE\"]}"; ok_or_die "mo firewall that bai" || continue
            AFTER=$(node_state); echo "== 7. trang thai sau: $AFTER"
            [ "$AFTER" = "open" ] || { echo "::warning::$NODE mo xong khong open"; FAILED="$FAILED $NODE"; continue; }
            call GET /connections
            if [ "$CLOSE_AFTER" = "true" ]; then
              echo "== 8. dong lai sau test"; call DELETE "/connections/$NODE"; ok_or_die "dong sau test that bai" || true
            fi
            echo "ENSURE-OPEN OK $NODE (truoc=$BEFORE sau=$AFTER)"; OKS="$OKS $NODE"
            done
            echo "== tong ket"
            curl -sS "$API/connections" -H "Authorization: Bearer $TOKEN" | python3 -c '
            import json,sys
            for r in json.load(sys.stdin).get("connections",[]): print("%-14s %-6s het_han=%s gia_han=%s loi=%s"%(r["node_code"],r["status"],r["expires_at"][:19],r["renew_count"],r["last_error"]))'
            echo "OK:    ${OKS:- (khong co)}"
            echo "LOI:   ${FAILED:- (khong co)}"
            [ -z "$OKS" ] && [ -n "$FAILED" ] && { echo "::error::khong node nao mo duoc"; exit 1; }
            echo "FULL FLOW OK"
        env:
          GATEPRO_API_PASSWORD: ${{ secrets.GATEPRO_API_PASSWORD }}
          NODE: ${{ inputs.node }}
          OPEN_FW: ${{ inputs.open_firewall }}
          CLOSE_AFTER: ${{ inputs.close_after }}
