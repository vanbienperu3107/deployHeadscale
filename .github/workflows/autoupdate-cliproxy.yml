name: Auto-update CLIProxyAPI

# Tu dong nang CLIProxyAPI tren vpn4 theo anh moi nhat cua FORK
# vanbienperu3107/cliproxy_mod (truoc 2026-09-10: theo eceasy/cli-proxy-api).
#
# Vi sao can: ban proxy cu tu nhan dien la Claude Code doi cu — Anthropic tu
# choi model moi (su co 2026-09-03: claude-fable-5 bao "version 2.1.251 or
# newer is required" vi image v7.2.112 khai la Claude Code 2.1.63). Cap nhat
# dinh ky thi khong bao gio bi ket model moi nua.
#
# Chuoi hang tuan: fork-sync-upstream.yml (repo fork, Chu nhat 07:00 UTC) merge
# upstream vao main cua fork, build + test, xanh thi build anh main-<sha>. Workflow
# nay chay sau do 3 gio.
#
# Cach chay: moi tuan (va bam tay duoc) —
#   1. Lay anh main-<sha> cua lan build fork-image XANH moi nhat.
#   2. So voi tag ANH DANG CHAY tren vpn4 (`docker inspect` container cliproxy).
#   3. Khac nhau -> dispatch workflow "Deploy CLIProxyAPI (vpn4)" voi tag moi
#      (deploy da co san verify 401/200 + smoke test completion tieng Viet;
#      auths/ giu nguyen nen KHONG mat dang nhap Claude/Codex).
#   4. Deploy do -> tuan sau thu lai; rollback thu cong: bam deploy voi tag cu.
#
# VI SAO KHONG CON DUNG repo variable CLIPROXY_DEPLOYED_TAG (sua 2026-09-09):
#
# GITHUB_TOKEN khong doc va khong ghi duoc Actions variables — `permissions:
# actions: write` KHONG cap quyen do. Ca hai loi goi deu tra 403 "Resource not
# accessible by integration". Buoc ghi thi bao do ro rang, nhung buoc DOC thi
# hong AM THAM: `gh api ... --jq .value` in nguyen cuc JSON loi ra stdout, nen
# CURRENT thanh chuoi JSON do va KHONG BAO GIO bang $LATEST -> changed=true moi
# tuan -> deploy lai cliproxy du khong co ban moi, restart container va lam rot
# request dang chay. Do duoc o run 34372896469.
#
# Bien do cung la mot BAN SAO cua trang thai that, va no da lech that: variable
# ghi v7.2.149 trong khi vpn4 dang chay v7.2.152. Nguon su that duy nhat la anh
# dang chay tren may. Hoi thang may thi khong can quyen gi them, va khong the lech.
#
# Luu y: viec restart container lam rot request dang chay do — nen cron dat
# 10:00 UTC Chu nhat (05:00 sang gio Peru, it nguoi dung).
on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch: {}

# actions: write la BAT BUOC cho buoc `gh workflow run deploy-cliproxy.yml`.
# PR #92 (2026-09-09) ha xuong chi con contents: read vi tuong quyen do chi phuc vu
# buoc ghi repo variable da bo - sai: dispatch cung can no. Loi khong lo ra suot
# hai ngay vi moi lan chay deu roi vao nhanh "khong co ban moi"; lan dau co ban
# moi that (run 34551872139) thi dispatch tra 403 Resource not accessible by
# integration. Quyen nay KHONG cho doc/ghi Actions variables - cai do van 403.
permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-vpn4-host-autoupdate
  cancel-in-progress: false

jobs:
  check-and-update:
    name: Kiem tra tag moi va deploy
    runs-on: ubuntu-latest
    steps:
      # Tu 2026-09-10 vpn4 chay anh build tu FORK vanbienperu3107/cliproxy_mod (tinh
      # nang lich su chat), khong con la eceasy/cli-proxy-api. So tag Docker Hub cua
      # upstream se luon khac anh dang chay va dispatch deploy voi mot tag khong ton
      # tai tren GHCR. Nguon dung bay gio: lan build fork-image XANH moi nhat tren
      # main cua fork. fork-sync-upstream.yml (Chu nhat 07:00 UTC) merge upstream vao
      # main, chi day khi build + test xanh, roi kich fork-image -> anh main-<sha>.
      #
      # Giu id `hub` va output `latest` de hai buoc so sanh/deploy ben duoi khong doi.
      - name: Lay anh fork moi nhat da build xanh
        id: hub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Chon sha co CA fork-image LAN fork-ci xanh. fork-image khong cho test (no
        # build ngay khi push), nen "anh xanh moi nhat" chua chac la code da qua test:
        # 2026-09-11 main-69a5c38 build xanh trong khi fork-ci cung sha do do. Deploy
        # anh do la dua code chua duoc kiem len may that.
        run: |
          REPO=vanbienperu3107/cliproxy_mod
          SHA=""
          for CAND in $(gh run list --repo "$REPO" --workflow fork-image.yml --branch main --status success --limit 10 --json headSha --jq '.[].headSha'); do
            OK=$(gh run list --repo "$REPO" --workflow fork-ci.yml --branch main --commit "$CAND" --status success --limit 1 --json databaseId --jq 'length')
            echo "  ung vien $(echo "$CAND" | cut -c1-7): fork-ci xanh = $OK"
            if [ "$OK" = "1" ]; then SHA="$CAND"; break; fi
          done
          if [ -z "$SHA" ]; then echo "::error::Khong co sha nao tren main cua fork co ca fork-image lan fork-ci xanh"; exit 1; fi
          LATEST="main-$(echo "$SHA" | cut -c1-7)"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Anh fork moi nhat: ghcr.io/vanbienperu3107/cliproxy_mod:$LATEST"

      # HAI step, va su phan cong giua chung la co y.
      #
      # appleboy/ssh-action@v1.2.0 KHONG co `capture_stdout` — input do chi ton
      # tai o ban moi hon (README tren nhanh master mo ta no, nhung ban duoc pin
      # o day thi khong; runner chi keu mot dong ##[warning] "Unexpected input"
      # roi chay tiep, output rong, va buoc sau chet vi ly do trong khong lien
      # quan). Do duoc o run 34382779241.
      #
      # Nen ta khong mang chuoi ve runner nua, ma de vpn4 TU SO SANH va tra loi
      # bang exit code. Kenh dan ket qua ve la `steps.cmp.outcome`.
      #
      # Step 1 khong `continue-on-error`: SSH hong, container chet, docker loi —
      # tat ca deu phai la DO THAT o day, va deu dung workflow. Nho vay khi sang
      # step 2 thi ta da BIET la SSH thong va `docker inspect` chay duoc, nen
      # `failure` cua no chi con MOT nghia duy nhat: tag khac nhau.
      - name: Doc anh cliproxy dang chay tren vpn4
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            docker inspect -f '{{.Config.Image}}' cliproxy

      - name: So voi tag moi nhat
        id: cmp
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          envs: LATEST
          script: |
            docker inspect -f '{{.Config.Image}}' cliproxy | grep -q ":$LATEST$"
        env:
          LATEST: ${{ steps.hub.outputs.latest }}

      - name: Ket luan
        run: |
          echo "So sanh tren vpn4: ${{ steps.cmp.outcome }} (success = dang chay dung tag moi nhat)"
          test "${{ steps.cmp.outcome }}" != "success" || echo "Khong co ban moi — bo qua."

      - name: Dispatch deploy voi tag moi va cho ket qua
        if: steps.cmp.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.hub.outputs.latest }}
        run: |
          gh workflow run deploy-cliproxy.yml --repo "$GITHUB_REPOSITORY" --ref main -f image_tag="$LATEST"
          # gh workflow run khong tra run id -> doi run moi nhat cua workflow do xuat hien roi watch.
          sleep 20
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-cliproxy.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Theo doi run $RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30

      # Thay cho buoc "ghi lai variable" cu: doc lai tu may that.
      #
      # Ghi mot con so vao variable chi noi rang ta TIN la da deploy xong; doc lai
      # anh dang chay noi rang no DA chay that. Va vi lan sau cung so bang chinh
      # phep doc nay, khong con cho nao de hai ban ghi lech nhau.
      - name: Xac minh vpn4 da chay tag moi
        if: steps.cmp.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          envs: LATEST
          script: |
            docker inspect -f '{{.Config.Image}}' cliproxy
            docker inspect -f '{{.Config.Image}}' cliproxy | grep -q ":$LATEST$"
        env:
          LATEST: ${{ steps.hub.outputs.latest }}
