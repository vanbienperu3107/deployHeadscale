name: Deploy public UI preview via memory Caddy

on:
  workflow_dispatch:

concurrency:
  group: deploy-vpn6-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN6 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH,PV_REF,PV_SHA
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi
            cd "$DEPLOY_PATH"
            git config --global --add safe.directory "$DEPLOY_PATH" || true
            # Ha tang (compose, Caddy) LUON lay tu main. Chi noi dung ui-preview/ lay tu nhanh da
            # dispatch (--ref), qua git archive dung commit -> xem prototype truoc khi merge ma
            # khong dua code chua duyet vao working tree production.
            git fetch origin main
            git reset --hard origin/main
            case "$PV_REF" in (*[!A-Za-z0-9._/-]*|"") echo "ref khong hop le: $PV_REF"; exit 1;; esac
            git fetch origin "refs/heads/$PV_REF"
            test "$(git rev-parse FETCH_HEAD)" = "$PV_SHA" || { echo "Nhanh $PV_REF da doi (FETCH_HEAD != $PV_SHA); dispatch lai."; exit 1; }
            PREVIEW_ROOT=/home/thanh/ui-previews
            TOKEN=$(openssl rand -hex 6)
            SLUG="preview-${{ github.run_id }}-$TOKEN"
            TEMP="$PREVIEW_ROOT/.${SLUG}.staging"
            TARGET="$PREVIEW_ROOT/$SLUG"
            $SUDO mkdir -p "$PREVIEW_ROOT/.meta"
            test ! -e "$TEMP" && test ! -e "$TARGET"
            $SUDO mkdir "$TEMP"
            git archive "$PV_SHA" ui-preview | $SUDO tar -x --strip-components=1 -C "$TEMP"
            $SUDO test -f "$TEMP/index.html"
            $SUDO mv "$TEMP" "$TARGET"
            printf '%s\t%s\t%s\n' "$(date -u +%Y-%m-%dT%H:%MZ)" "$PV_REF" "$(printf %s "$PV_SHA" | cut -c1-7)" | $SUDO tee "$PREVIEW_ROOT/.meta/$SLUG" >/dev/null

            # Trang goc: sinh lai tu MOI snapshot dang co (moi nhat truoc) -> khong mat link ban cu.
            INDEX_TMP="$PREVIEW_ROOT/.index.html.tmp"
            {
              printf '<!doctype html><html lang="vi"><meta charset="utf-8"><title>UI previews</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px/1.5 system-ui;margin:3rem auto;max-width:48rem;padding:0 1rem;color:#171d1a;background:#f5fbf5}a{color:#1a6b51}li{padding:.35rem 0}small{color:#404944}</style>'
              printf '<h1>UI previews</h1><p><a href="/%s/">Mở bản mới nhất</a></p><ol>' "$SLUG"
              for d in $(ls -1dt "$PREVIEW_ROOT"/preview-*/ 2>/dev/null); do
                s=$(basename "$d")
                if [ -f "$PREVIEW_ROOT/.meta/$s" ]; then
                  IFS="$(printf '\t')" read -r when ref sha < "$PREVIEW_ROOT/.meta/$s"
                  printf '<li><a href="/%s/">%s</a> <small>%s · %s</small></li>' "$s" "$ref@$sha" "$when" "$s"
                else
                  printf '<li><a href="/%s/">%s</a> <small>(trước khi có metadata)</small></li>' "$s" "$s"
                fi
              done
              printf '</ol></html>'
            } | $SUDO tee "$INDEX_TMP" >/dev/null
            $SUDO mv "$INDEX_TMP" "$PREVIEW_ROOT/index.html"

            $SUDO docker compose up -d --no-deps --force-recreate ui-preview
            $SUDO docker network connect memory-stack_memnet ui-preview 2>/dev/null || true

            CADDYFILE=/home/thanh/memory-stack/Caddyfile
            BACKUP=/home/thanh/memory-stack/Caddyfile.preview-backup
            $SUDO test -f "$CADDYFILE"
            $SUDO cp "$CADDYFILE" "$BACKUP"
            if ! $SUDO grep -q '^view\.hangocthanh\.io\.vn {' "$CADDYFILE"; then
              printf '\nview.hangocthanh.io.vn {\n    encode gzip\n    reverse_proxy ui-preview:8080\n}\n' | $SUDO tee -a "$CADDYFILE" >/dev/null
            fi
            if ! $SUDO docker exec memory-caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
              $SUDO cp "$BACKUP" "$CADDYFILE"
              exit 1
            fi
            $SUDO docker restart memory-caddy
            URL="https://view.hangocthanh.io.vn/$SLUG/"
            for _ in $(seq 1 30); do
              code=$(curl -k -sS -o /dev/null -w '%{http_code}' --resolve view.hangocthanh.io.vn:443:127.0.0.1 "$URL" || true)
              if [ "$code" = "200" ]; then
                echo "Public UI preview: $URL"
                exit 0
              fi
              sleep 5
            done
            $SUDO docker logs --tail 100 memory-caddy
            exit 1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          # Nhanh va commit da dispatch: gh workflow run deploy-preview-memory-caddy.yml --ref <branch>
          PV_REF: ${{ github.ref_name }}
          PV_SHA: ${{ github.sha }}
