name: Deploy Kuma heartbeat (vpn4)

# Cai script heartbeat per-service len vpn4: cron moi phut check tung container
# local roi push len Uptime Kuma (vpn6). Xem uptime-kuma/vpn4-heartbeat.sh.
#
# CHAY SAU khi Kuma da song va anh da tao cac Push monitor trong UI de co token.
# Input `conf` = noi dung /etc/kuma-heartbeat.conf, moi dong "<container|host> <token>".
# Vi du:
#   host abc111
#   derper abc222
#   cliproxy abc333
#   edge-nginx abc444
#   caddy-edge abc555
#   edge-fail2ban abc666
#   vpn-gw abc777
#   ts-vpngw abc888
#   ping-reporter-vpn4 abc999
# Chay lai voi conf moi = ghi de conf cu (idempotent). Bo trong input -> giu conf hien co,
# chi cap nhat script + cron.
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch/ref de lay script"
        required: false
        default: "main"
      conf:
        description: "Noi dung kuma-heartbeat.conf (de trong = giu conf cu)"
        required: false
        default: ""

concurrency:
  # Cung host vpn4 voi cac workflow deploy vpn4 khac.
  group: deploy-vpn4-host
  cancel-in-progress: false

jobs:
  deploy:
    name: Cai heartbeat cron len vpn4
    runs-on: ubuntu-latest
    steps:
      - name: SSH vao vpn4 — cai script + conf + cron
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH,REPO_URL,GIT_REF,HB_CONF
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi

            echo "==> [1/4] Cap nhat repo (ref=$GIT_REF)"
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              $SUDO mkdir -p "$DEPLOY_PATH"
              $SUDO git clone "$REPO_URL" "$DEPLOY_PATH"
              $SUDO chown -R "$(id -un):$(id -gn)" "$DEPLOY_PATH"
            fi
            cd "$DEPLOY_PATH"
            git config --global --add safe.directory "$DEPLOY_PATH" || true
            git fetch --all --prune
            git reset --hard "origin/$GIT_REF"

            echo "==> [2/4] Cai script"
            $SUDO install -m 0755 "$DEPLOY_PATH/uptime-kuma/vpn4-heartbeat.sh" /usr/local/bin/kuma-heartbeat.sh

            echo "==> [3/4] Ghi conf (neu input co noi dung)"
            if [ -n "${HB_CONF:-}" ]; then
              printf '%s\n' "$HB_CONF" | $SUDO tee /etc/kuma-heartbeat.conf >/dev/null
              $SUDO chmod 600 /etc/kuma-heartbeat.conf
              echo "  Da ghi conf moi ($(printf '%s\n' "$HB_CONF" | grep -vc '^\s*$') dong)"
            else
              if [ -f /etc/kuma-heartbeat.conf ]; then echo "  Giu conf hien co"; else echo "::warning::Chua co /etc/kuma-heartbeat.conf — cron se fail cho toi khi chay lai workflow voi input conf"; fi
            fi

            echo "==> [4/4] Cai cron moi phut + chay thu"
            printf '* * * * * root /usr/local/bin/kuma-heartbeat.sh >/dev/null 2>&1\n' | $SUDO tee /etc/cron.d/kuma-heartbeat >/dev/null
            $SUDO chmod 644 /etc/cron.d/kuma-heartbeat
            if [ -f /etc/kuma-heartbeat.conf ]; then
              echo "  Chay thu:"
              $SUDO /usr/local/bin/kuma-heartbeat.sh || true
            fi
            echo "XONG. Kuma se thay heartbeat trong <=60s; monitor Push dat nguong 120s."
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REPO_URL: https://github.com/vanbienperu3107/deployHeadscale.git
          GIT_REF: ${{ github.event.inputs.git_ref }}
          HB_CONF: ${{ github.event.inputs.conf }}
