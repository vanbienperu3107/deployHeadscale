name: Configure CLIProxyAPI quota failover

# Dat priority tai khoan Claude (primary -> backup) + bat chuyen khi het quota.
#
# Tu 2026-10-02 goi MANAGEMENT API qua https://cliproxy.hangocthanh.io.vn thay vi
# SSH vao vpn4 sua auths/*.json + config.yaml: khi bat kho Postgres (PGSTORE),
# proxy doc config + token tu DB nen sua file khong con tac dung. API dung duoc ca
# hai che do, va khong can restart proxy (khong rot request dang chay).
on:
  workflow_dispatch:
    inputs:
      primary_email:
        description: "Claude account to use first"
        required: true
        default: "hangocthanhperu3107@gmail.com"
      backup_email:
        description: "Claude account to use after primary quota is exhausted"
        required: true
        default: "hangocthanh3107@gmail.com"
      primary_priority:
        description: "Priority for primary account; larger value wins"
        required: true
        default: "2"
      backup_priority:
        description: "Priority for backup account"
        required: true
        default: "1"

concurrency:
  group: deploy-vpn4-host
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  configure:
    name: Configure OAuth priorities via Management API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update priorities + quota switch
        env:
          CLIPROXY_BASE_URL: https://cliproxy.hangocthanh.io.vn
          CLIPROXY_MGMT_KEY: ${{ secrets.CLIPROXY_MGMT_KEY }}
          PRIMARY_EMAIL: ${{ github.event.inputs.primary_email }}
          BACKUP_EMAIL: ${{ github.event.inputs.backup_email }}
          PRIMARY_PRIORITY: ${{ github.event.inputs.primary_priority }}
          BACKUP_PRIORITY: ${{ github.event.inputs.backup_priority }}
        run: python3 cliproxy/quota-failover.py
