name: Configure CLIProxyAPI quota failover

on:
  workflow_dispatch:
    inputs:
      primary_email:
        description: "Claude account to use first"
        required: true
        default: "hangocthanhperu3107@gmail.com"
      backup_email:
        description: "Claude account to use after primary quota is exhausted"
        required: true
        default: "hangocthanh3107@gmail.com"
      primary_priority:
        description: "Priority for primary account; larger value wins"
        required: true
        default: "2"
      backup_priority:
        description: "Priority for backup account"
        required: true
        default: "1"

concurrency:
  group: deploy-vpn4-host
  cancel-in-progress: false

jobs:
  configure:
    name: Configure OAuth priorities on vpn4
    runs-on: ubuntu-latest
    steps:
      - name: SSH into vpn4 and update auth metadata
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH,PRIMARY_EMAIL,BACKUP_EMAIL,PRIMARY_PRIORITY,BACKUP_PRIORITY
          script_stop: false
          command_timeout: 10m
          script: |
            set -e
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi
            cd "$DEPLOY_PATH/cliproxy"
            test -d auths
            python3 -c 'import json,os,pathlib,sys;auth_dir=pathlib.Path("auths");targets={os.environ["PRIMARY_EMAIL"].strip().lower():(int(os.environ["PRIMARY_PRIORITY"]),"primary"),os.environ["BACKUP_EMAIL"].strip().lower():(int(os.environ["BACKUP_PRIORITY"]),"backup")};changed=[];seen=set();
            def find_email(data):
                candidates=[data.get("email"),data.get("label")]
                for key in ("metadata","storage"):
                    node=data.get(key)
                    if isinstance(node,dict): candidates.append(node.get("email"))
                for value in candidates:
                    if isinstance(value,str) and "@" in value: return value.strip().lower()
                return ""
            for path in sorted(auth_dir.glob("*.json")):
                try: data=json.loads(path.read_text(encoding="utf-8"))
                except Exception as exc: print(f"skip {path.name}: invalid json: {exc}"); continue
                provider=str(data.get("type") or data.get("provider") or "").strip().lower(); email=find_email(data)
                if provider and provider != "claude": continue
                if email not in targets: continue
                priority,role=targets[email]; seen.add(email); data["priority"]=priority; data["weight"]=1
                if "disabled" in data: data["disabled"]=False
                path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"); path.chmod(0o600); changed.append((path.name,email,role,priority))
            missing=set(targets)-seen
            for name,email,role,priority in changed: print(f"updated {name}: {email} role={role} priority={priority} weight=1 enabled=true")
            if missing: print("missing target emails: "+", ".join(sorted(missing))); sys.exit(1)
            if len(changed)<2: print("expected at least two changed Claude auth files"); sys.exit(1)'

            if grep -q '^  session-affinity: true' config.yaml; then
              python3 -c "from pathlib import Path;p=Path('config.yaml');s=p.read_text();p.write_text(s.replace('  session-affinity: true','  session-affinity: false'))"
              echo "updated config.yaml: session-affinity=false"
            else
              echo "config.yaml: session-affinity already not true"
            fi

            python3 -c 'from pathlib import Path; p=Path("config.yaml"); lines=p.read_text().splitlines(); out=[]; in_block=False; seen_block=False; seen_switch=False; seen_preview=False
            for line in lines:
                if line.startswith("quota-exceeded:"):
                    seen_block=True; in_block=True; seen_switch=False; seen_preview=False; out.append(line); continue
                if in_block and line and not line.startswith((" ","\t","#")):
                    if not seen_switch: out.append("  switch-project: true")
                    if not seen_preview: out.append("  switch-preview-model: true")
                    in_block=False
                if in_block and line.strip().startswith("switch-project:"):
                    out.append("  switch-project: true"); seen_switch=True; continue
                if in_block and line.strip().startswith("switch-preview-model:"):
                    out.append("  switch-preview-model: true"); seen_preview=True; continue
                out.append(line)
            if in_block:
                if not seen_switch: out.append("  switch-project: true")
                if not seen_preview: out.append("  switch-preview-model: true")
            if not seen_block:
                if out and out[-1] != "": out.append("")
                out.extend(["quota-exceeded:","  switch-project: true","  switch-preview-model: true"])
            p.write_text("\n".join(out)+"\n")'
            echo "config.yaml: quota-exceeded.switch-project=true"

            $SUDO docker compose restart cliproxy
            for _ in $(seq 1 30); do
              if bash -c 'exec 3<>/dev/tcp/127.0.0.1/28417' 2>/dev/null; then break; fi
              sleep 2
            done
            $SUDO docker compose ps cliproxy
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PRIMARY_EMAIL: ${{ github.event.inputs.primary_email }}
          BACKUP_EMAIL: ${{ github.event.inputs.backup_email }}
          PRIMARY_PRIORITY: ${{ github.event.inputs.primary_priority }}
          BACKUP_PRIORITY: ${{ github.event.inputs.backup_priority }}
