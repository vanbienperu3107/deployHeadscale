name: Deploy vpn-gw (vpn4)

# Trien khai stack VPN gateway (sidecar tailscale + vpn-gw) len vpn4: pull image
# tu GHCR, ghi config tu secrets, compose up, verify egress di qua VPN Bitel.
# Xem docs/plan-vpn-gateway-bitel.md (Phase 2).
on:
  workflow_dispatch:
    inputs:
      routes:
        description: >-
          Subnet route du phong cho vpngw (vd 10.121.0.0/16). RONG = tat.
          Bat = Pha 2, phai lam trong cua so bao tri: doc docs/plan-vpn-route-failover.md
          §5 truoc. Route chi thuc su len khi route-agent probe THANH CONG
          (advertise-on-healthy), va van phai duoc approve trong headscale.
        required: false
        default: ''
      probe_target:
        description: >-
          host:port de probe "duong con song that". Mac dinh 10.121.124.155:3389
          (RDP may IT OPS). Phai la dich vu THAT — ping khong dung duoc vi may
          dich chan ICMP.
        required: false
        default: '10.121.124.155:3389'

concurrency:
  # Cung host vpn4 voi deploy-derp-vpn4 -> xep hang tuan tu, tranh dpkg/docker lock.
  group: deploy-vpn4-host
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy vpn-gw stack len vpn4
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Tao preauthkey cho node vpngw (chay tren runner)
        id: ts_key
        env:
          HS_API_KEY: ${{ secrets.HEADPLANE_HS_API_KEY }}
        run: |
          RESPONSE=$(curl -sf -m 15 \
            -H "Authorization: Bearer $HS_API_KEY" \
            "https://vpn2.hangocthanh.io.vn/api/v1/user" 2>/dev/null \
            || echo '{"users":[]}')
          USER_ID=$(echo "$RESPONSE" | python3 -c \
            "import json,sys; d=json.load(sys.stdin); u=d.get('users',d.get('user',[])); print(int(u[0].get('id',0)) if isinstance(u,list) and u else '')" \
            2>/dev/null || echo "")
          echo "headscale user id=$USER_ID"
          EXPIRY=$(date -d '+365 days' -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo "")
          KEY=""
          if [ -n "$USER_ID" ] && [ "$USER_ID" != "0" ]; then
            PKEY_RESP=$(curl -sf -m 15 -X POST \
              -H "Authorization: Bearer $HS_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"user\":\"$USER_ID\",\"reusable\":true,\"expiration\":\"$EXPIRY\"}" \
              "https://vpn2.hangocthanh.io.vn/api/v1/preauthkey" 2>/dev/null || echo "")
            KEY=$(echo "$PKEY_RESP" | python3 -c \
              "import json,sys; d=json.load(sys.stdin); print(d.get('preAuthKey',{}).get('key','') or d.get('key',''))" \
              2>/dev/null || echo "")
          fi
          if [ -z "$KEY" ]; then
            echo "::error::Khong tao duoc preauthkey (user id=$USER_ID) — kiem tra HS_API_KEY/API"
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "Tao preauthkey thanh cong (user id=$USER_ID)"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: SSH vao vpn4 — pull GHCR + ghi config + compose up + verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          # ⚠️ CHI bien co ten trong danh sach nay moi duoc chuyen qua SSH. Khai
          # bao o "env:" ben duoi la CHUA DU — deploy 31293752510 chay xanh nhung
          # VPN_GW_ROUTES ve toi may van rong, nen route khong bao gio duoc bat.
          envs: DEPLOY_PATH,REPO_URL,DEPLOY_REF,TS_AUTHKEY,GHCR_ACTOR,GHCR_TOKEN,OVPN_B64,OVPN_USER,OVPN_PASS,DASHBOARD_URL,VPN_GW_NAME,VPN_GW_AGENT_TOKEN,VPN_GW_ROUTES,PROBE_TARGET,REQUIRE_FORWARD
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi

            echo "==> [1/6] Clone/cap nhat repo"
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              $SUDO mkdir -p "$DEPLOY_PATH"
              $SUDO git clone "$REPO_URL" "$DEPLOY_PATH"
              $SUDO chown -R "$(id -un):$(id -gn)" "$DEPLOY_PATH"
            fi
            cd "$DEPLOY_PATH"
            git config --global --add safe.directory "$DEPLOY_PATH" || true
            git fetch --all --prune
            git reset --hard "origin/${DEPLOY_REF:-main}"

            echo "==> [2/6] Ghi config (client.ovpn + auth.txt) tu secrets"
            cd "$DEPLOY_PATH/vpn-gw"
            umask 077
            mkdir -p config
            printf '%s' "$OVPN_B64" | base64 -d > config/client.ovpn
            printf '%s\n%s\n' "$OVPN_USER" "$OVPN_PASS" > config/auth.txt
            chmod 600 config/client.ovpn config/auth.txt
            echo "  config da ghi ($(wc -c < config/client.ovpn) bytes ovpn)"

            echo "==> [3/6] Ghi .env (TS_AUTHKEY + telemetry + route/probe)"
            # ⚠️ Dau chuyen huong ghi de cat cut file: MOI khoa can thiet phai co
            # mat o day. Truoc 2026-08-09 VPN_GW_ROUTES/PROBE_TARGET chi ton tai
            # neu go tay tren may -> mot lan chay workflow la bay mat, va dieu do
            # khong bao gio duoc phat hien cho toi luc itop chet that.
            {
              printf 'TS_AUTHKEY=%s\n' "${TS_AUTHKEY:-}"
              printf 'DASHBOARD_URL=%s\n' "${DASHBOARD_URL:-}"
              printf 'VPN_GW_NAME=%s\n' "${VPN_GW_NAME:-}"
              printf 'VPN_GW_AGENT_TOKEN=%s\n' "${VPN_GW_AGENT_TOKEN:-}"
              printf 'VPN_GW_ROUTES=%s\n' "${VPN_GW_ROUTES:-}"
              printf 'PROBE_TARGET=%s\n' "${PROBE_TARGET:-10.121.124.155:3389}"
              printf 'REQUIRE_FORWARD=%s\n' "${REQUIRE_FORWARD:-0}"
            } > .env
            chmod 600 .env

            echo "==> [3b/6] Cai route-agent (advertise-on-healthy)"
            # Agent chay tren HOST, khong trong container: no goi "tailscale set"
            # tren socket LocalAPI, ma mount socket do vao container dang mo
            # tinyproxy cho ca tailnet la trao quyen dieu khien node cho be mat
            # tan cong do. Xem vpn-gw/route-agent.sh.
            # Dung "install -m 0755" chu KHONG phai cp roi doi mode: buoc [1/6]
            # dong bo cung repo moi lan deploy, ma git chi luu mode 644/755 theo
            # index — file tao tren Windows vao repo voi mode 644 nen bit +x se
            # bien mat sau MOI lan reset. Cai ra /usr/local/bin voi mode tuong
            # minh thi khong phu thuoc mode trong repo nua.
            $SUDO install -m 0755 "$DEPLOY_PATH/vpn-gw/route-agent.sh" /usr/local/bin/vpngw-route-agent.sh
            # DASHBOARD_URL/VPN_GW_NAME/VPN_GW_AGENT_TOKEN: de route-agent doc
            # danh sach route tu bang "TRANG DI QUA VPN" tren dashboard. Admin
            # bat/tat mot IP o do la route theo do ma len/xuong, khong phai chay
            # lai workflow. VPN_GW_ROUTES chi con la fallback khi API loi.
            {
              printf 'VPN_GW_ROUTES=%s\n' "${VPN_GW_ROUTES:-}"
              printf 'PROBE_TARGET=%s\n' "${PROBE_TARGET:-10.121.124.155:3389}"
              printf 'DASHBOARD_URL=%s\n' "${DASHBOARD_URL:-}"
              printf 'VPN_GW_NAME=%s\n' "${VPN_GW_NAME:-}"
              printf 'VPN_GW_AGENT_TOKEN=%s\n' "${VPN_GW_AGENT_TOKEN:-}"
            } | $SUDO tee /etc/vpngw-route-agent.env >/dev/null
            $SUDO chmod 600 /etc/vpngw-route-agent.env
            $SUDO install -m 0644 "$DEPLOY_PATH/vpn-gw/vpngw-route-agent.service" /etc/systemd/system/vpngw-route-agent.service
            $SUDO install -m 0644 "$DEPLOY_PATH/vpn-gw/vpngw-route-agent.timer"   /etc/systemd/system/vpngw-route-agent.timer
            echo "  da cai script + unit"
            $SUDO systemctl daemon-reload
            echo "  daemon-reload xong"
            # LUU Y: TUYET DOI khong dung dau huyen (backtick) trong comment cua
            # script nay. appleboy/ssh-action boc script qua mot lop quoting nen
            # doan trong backtick BI THUC THI nhu command substitution, du no nam
            # sau dau #. Ba lan deploy lien tiep (31288635570, 31288946171,
            # 31289161190) chet dung tai comment co backtick, moi lan lai o mot
            # cho khac — rat de doc nham thanh "lenh ke ben bi loi".
            # Kiem tra unit bang tay: systemd-analyze verify /etc/systemd/system/vpngw-route-agent.service
            # set -x de log lo ra LENH THAT dang chay: bon lan deploy truoc deu
            # dung ngay sau moc echo gan nhat, ma moi lan doan "lenh ke tiep" lai
            # sai. Dung dang PHANG (khong if/else nhieu dong) cho de doc log.
            set -x
            $SUDO systemctl disable --now vpngw-route-agent.timer >/dev/null 2>&1 || true
            # Bat agent khi CO NGUON cau hinh: token dashboard (nguon chinh) HOAC
            # VPN_GW_ROUTES (fallback). Agent tu quyet dinh quang ba gi dua tren
            # bang "TRANG DI QUA VPN" + ket qua probe; danh sach trong = no rut.
            AGENT_ON="${VPN_GW_AGENT_TOKEN:-}${VPN_GW_ROUTES:-}"
            [ -z "$AGENT_ON" ] || $SUDO systemctl enable --now vpngw-route-agent.timer
            set +x
            echo "  route-agent cai xong (nguon: dashboard; fallback VPN_GW_ROUTES='${VPN_GW_ROUTES:-}')"

            echo "==> [4/6] Login GHCR + pull image"
            echo "$GHCR_TOKEN" | $SUDO docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            $SUDO docker compose pull

            echo "==> [5/6] Compose up"
            $SUDO docker compose up -d --remove-orphans
            $SUDO docker logout ghcr.io || true
            sleep 8
            $SUDO docker compose ps

            echo "==> [6/6] Verify: tun0 len + egress di qua VPN"
            echo "  Cho tun0 (toi da 120s)..."
            up=0
            for _ in $(seq 1 40); do
              if $SUDO docker exec vpn-gw ip link show tun0 up >/dev/null 2>&1; then up=1; break; fi
              sleep 3
            done
            if [ "$up" != "1" ]; then
              echo "::error::tun0 khong len sau 120s"
              $SUDO docker logs --tail 40 vpn-gw 2>&1 || true
              exit 1
            fi
            echo "  tun0 LEN. Kiem tra egress IP (phai != IP vpn4)..."
            EGRESS=$($SUDO docker exec vpn-gw curl -s --max-time 20 -x http://127.0.0.1:8888 https://api.ipify.org 2>/dev/null || echo "")
            echo "  egress qua proxy = '$EGRESS'"
            HOSTIP=$(curl -s --max-time 10 https://api.ipify.org 2>/dev/null || echo "runner")
            if [ -z "$EGRESS" ]; then
              echo "::error::Khong lay duoc egress IP qua proxy"
              exit 1
            fi
            echo "  Kiem tra vao jump.bitel.com.pe qua proxy..."
            CODE=$($SUDO docker exec vpn-gw curl -s -o /dev/null -w '%{http_code}' \
              --max-time 25 -x http://127.0.0.1:8888 https://jump.bitel.com.pe/ 2>/dev/null || echo 000)
            echo "  jump.bitel.com.pe qua proxy: HTTP $CODE"
            echo "  IP tailnet vpngw:"
            $SUDO docker exec ts-vpngw tailscale ip -4 2>&1 | head -2 || true

            echo "==> [6b/6] Assert mat phang forward (chan cac loi im lang)"
            # (1) ip_forward: neu 0 thi subnet route quang ba ma khong chuyen tiep
            #     duoc goi nao, ma "headscale nodes list-routes" van xanh nen khong ai biet.
            FWD=$($SUDO docker exec ts-vpngw cat /proc/sys/net/ipv4/ip_forward 2>/dev/null || echo 0)
            echo "  ip_forward=$FWD"
            if [ "$FWD" != "1" ]; then
              echo "::error::ip_forward=0 — thieu 'sysctls: [net.ipv4.ip_forward=1]' tren ts-vpngw"
              exit 1
            fi
            # (2) crashloop: containerboot coi loi ghi sysctl la FATAL. ts-vpngw la
            #     chu netns nen no crashloop keo theo tinyproxy chet cung.
            RC=$($SUDO docker inspect -f '{{.RestartCount}}' ts-vpngw 2>/dev/null || echo -1)
            echo "  ts-vpngw RestartCount=$RC"
            if [ "$RC" != "0" ]; then
              echo "::error::ts-vpngw da restart $RC lan — nghi crashloop"
              $SUDO docker logs --tail 40 ts-vpngw 2>&1 || true
              exit 1
            fi
            # (3) luat FORWARD phai do IMAGE tao, khong phai do nguoi go tay.
            $SUDO docker exec vpn-gw iptables -C FORWARD -i tailscale0 -o tun0 -j ACCEPT 2>/dev/null \
              && echo "  FORWARD tailscale0->tun0: OK" \
              || { echo "::error::thieu luat FORWARD tailscale0->tun0"; exit 1; }
            $SUDO docker exec vpn-gw iptables -C FORWARD -i tailscale0 '!' -o tun0 -j REJECT --reject-with icmp-net-unreachable 2>/dev/null \
              && echo "  REJECT ro ra eth0: OK" \
              || { echo "::error::thieu luat REJECT chong ro ra eth0"; exit 1; }
            # (4) advertise phai KHOP y dinh: rong o Pha 1, dung VPN_GW_ROUTES khi bat.
            ADV=$($SUDO docker exec ts-vpngw tailscale debug prefs 2>/dev/null | grep -o '"AdvertiseRoutes":[^,]*' || echo '?')
            echo "  prefs $ADV (VPN_GW_ROUTES='${VPN_GW_ROUTES:-}')"
            # (5) Neu nguoi chay DA yeu cau bat route thi timer phai enabled. Chan
            #     dung lop loi cua deploy 31293752510: workflow xanh, moi assert
            #     xanh, nhung bien khong toi duoc may nen route khong bao gio bat
            #     — va khong ai biet cho toi luc itop chet that.
            [ -z "${VPN_GW_AGENT_TOKEN:-}${VPN_GW_ROUTES:-}" ] || $SUDO systemctl is-enabled vpngw-route-agent.timer >/dev/null 2>&1 || {
              echo "::error::co nguon cau hinh route nhung timer route-agent KHONG enabled"; exit 1; }
            if [ -z "${VPN_GW_ROUTES:-}" ] && ! printf '%s' "$ADV" | grep -q 'null'; then
              echo "::error::VPN_GW_ROUTES rong nhung node VAN dang advertise — route-agent hoac containerboot ghi ngoai y muon"
              exit 1
            fi
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REPO_URL: https://github.com/vanbienperu3107/deployHeadscale.git
          DEPLOY_REF: ${{ github.ref_name }}
          TS_AUTHKEY: ${{ steps.ts_key.outputs.key }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVPN_B64: ${{ secrets.BITEL_OVPN_CONFIG_B64 }}
          OVPN_USER: ${{ secrets.BITEL_OVPN_USER }}
          OVPN_PASS: ${{ secrets.BITEL_OVPN_PASS }}
          # Backend phuc vu duoi /app (Caddy handle_path /app/* -> derp-backend, strip /app).
          DASHBOARD_URL: https://vpn2.hangocthanh.io.vn/app
          VPN_GW_NAME: bitel
          VPN_GW_AGENT_TOKEN: ${{ secrets.VPN_GW_AGENT_TOKEN }}
          # ── Subnet route du phong ──────────────────────────────────────────
          # RONG = tat (Pha 1: chi cai san mat phang forward + route-agent, KHONG
          # dong gi vao tailnet). Bat o Pha 2 bang cach dat inputs.routes khi chay
          # workflow — KHONG sua tay .env tren may, vi buoc [3/6] ghi de cat cut
          # file moi lan deploy.
          VPN_GW_ROUTES: ${{ inputs.routes }}
          # Dich probe "duong con song that". Mac dinh RDP may IT OPS — dung dich
          # vu nguoi dung can. KHONG dung ping (may dich chan ICMP) va khong dung
          # link-state tun0 (Bitel chan theo tai khoan thi tun0 van UP).
          PROBE_TARGET: ${{ inputs.probe_target || '10.121.124.155:3389' }}
          # =1 khi da bat route: healthcheck coi ip_forward=0 la hong.
          REQUIRE_FORWARD: ${{ inputs.routes && '1' || '0' }}
