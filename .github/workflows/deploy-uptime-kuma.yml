name: Deploy Uptime Kuma (vpn6)

# Giam sat vpn4/vpn6 + canh bao Telegram. Xem uptime-kuma/README.md va
# docs/plan-uptime-kuma.md.
#
# CHI workflow_dispatch — vpn6 la box production (memory-stack + derper + headscale).
# Workflow: compose up container Kuma (127.0.0.1:3001) roi chay setup-caddy.sh
# (ghep block status.hangocthanh.io.vn vao Caddyfile memory-stack, idempotent,
# backup + validate truoc reload).
#
# DIEU KIEN TRUOC: ban ghi DNS A status.hangocthanh.io.vn -> vpn6 (45.119.87.220).
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch/ref de deploy"
        required: false
        default: "main"

concurrency:
  group: deploy-uptime-kuma-vpn6
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Uptime Kuma len vpn6
    runs-on: ubuntu-latest
    steps:
      - name: Kiem tra DNS status.hangocthanh.io.vn (truoc khi dung toi vpn6)
        env:
          HOST: ${{ secrets.SSH_HOST_VPN6 }}
        run: |
          RESOLVED=$(python3 -c "import socket;print(socket.gethostbyname('status.hangocthanh.io.vn'))" 2>/dev/null || echo "")
          if [ -z "$RESOLVED" ]; then
            echo "::error::status.hangocthanh.io.vn chua phan giai duoc. Them ban ghi A tro toi vpn6 roi chay lai."
            exit 1
          fi
          if [ "$RESOLVED" != "$HOST" ]; then
            echo "::error::status.hangocthanh.io.vn tro sai dich (khong phai vpn6)."
            exit 1
          fi
          echo "DNS OK: status.hangocthanh.io.vn -> vpn6"

      - name: SSH vao vpn6 — compose up Kuma + ghep Caddy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN6 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH,REPO_URL,GIT_REF
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi

            echo "==> [1/4] Clone/cap nhat repo (ref=$GIT_REF)"
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              $SUDO mkdir -p "$DEPLOY_PATH"
              $SUDO git clone "$REPO_URL" "$DEPLOY_PATH"
              $SUDO chown -R "$(id -un):$(id -gn)" "$DEPLOY_PATH"
            fi
            cd "$DEPLOY_PATH"
            git config --global --add safe.directory "$DEPLOY_PATH" || true
            git fetch --all --prune
            git reset --hard "origin/$GIT_REF"

            echo "==> [2/4] Khoi dong Uptime Kuma"
            cd "$DEPLOY_PATH/uptime-kuma"
            $SUDO docker compose pull
            $SUDO docker compose up -d --remove-orphans

            echo "==> [3/4] Ghep block Caddy (idempotent, backup + validate)"
            $SUDO sh "$DEPLOY_PATH/uptime-kuma/setup-caddy.sh"

            echo "==> [4/4] Health check"
            sleep 8
            $SUDO docker compose ps
            for _ in $(seq 1 10); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:3001 || true)
              if [ "$CODE" = "200" ] || [ "$CODE" = "302" ]; then echo "Kuma local OK ($CODE)"; break; fi
              echo "Kuma chua san sang (code=$CODE), cho 5s..."; sleep 5
            done
            CODE_PUB=$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://status.hangocthanh.io.vn || true)
            echo "https://status.hangocthanh.io.vn -> HTTP $CODE_PUB (200/302 = OK; cert LE co the can them ~1 phut lan dau)"
            echo ""
            echo "BUOC TIEP THEO (TAY, xem uptime-kuma/README.md):"
            echo " 1. Tao admin tren https://status.hangocthanh.io.vn"
            echo " 2. Settings -> Notifications -> Telegram (@VotamAIbot token + chat id)"
            echo " 3. Them monitors + Push heartbeat vpn4"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REPO_URL: https://github.com/vanbienperu3107/deployHeadscale.git
          GIT_REF: ${{ github.event.inputs.git_ref }}
