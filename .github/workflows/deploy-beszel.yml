name: Deploy Beszel monitoring (vpn6 hub + agents vpn6/vpn4)

# Giam sat tai nguyen 2 VPS tren 1 giao dien: https://status.hangocthanh.io.vn
#   - Hub Beszel tai /opt/beszel (vpn6), join memory-stack_memnet de memory-caddy proxy toi "beszel:8090".
#   - Agent vpn6: network_mode host + docker.sock ro; hub goi host.docker.internal:45876.
#   - Agent vpn4: docker run --network host; ufw chi mo 45876 cho IP vpn6.
#   - Keypair ed25519 sinh tren runner, dat vao /beszel_data truoc khi hub start; pubkey phat cho agent.
#   - bootstrap.py tao superuser/user/system qua PocketBase API. Cred: /root/beszel-admin.txt (vpn6).
# LUU Y drone-ssh: KHONG dung heredoc/if-else nhieu dong trong script (bi chen exit-check tung dong).
# File cau hinh nam o beszel/ trong repo, copy bang scp-action.

on:
  workflow_dispatch:

concurrency:
  group: deploy-beszel
  cancel-in-progress: false

jobs:
  keygen:
    name: Sinh keypair ed25519
    runs-on: ubuntu-latest
    outputs:
      priv_b64: ${{ steps.gen.outputs.priv_b64 }}
      pub: ${{ steps.gen.outputs.pub }}
    steps:
      - name: ssh-keygen
        id: gen
        run: |
          ssh-keygen -t ed25519 -N "" -f ./beszel_key -C beszel-hub -q
          echo "priv_b64=$(base64 -w0 ./beszel_key)" >> "$GITHUB_OUTPUT"
          echo "pub=$(cut -d' ' -f1-2 ./beszel_key.pub)" >> "$GITHUB_OUTPUT"

  vpn6:
    name: Hub + agent + Caddy + bootstrap (vpn6)
    needs: keygen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy beszel/ len vpn6
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_VPN6 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "beszel/docker-compose.yml,beszel/bootstrap.py"
          target: /opt
          overwrite: true

      - name: SSH vpn6
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN6 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          command_timeout: 15m
          envs: BESZEL_PRIV_B64,BESZEL_PUB
          script: |
            set -e
            echo "==> [1/6] keypair hub + .env"
            mkdir -p /opt/beszel/beszel_data
            echo "$BESZEL_PRIV_B64" | base64 -d > /opt/beszel/beszel_data/id_ed25519
            echo "$BESZEL_PUB" > /opt/beszel/beszel_data/id_ed25519.pub
            chmod 600 /opt/beszel/beszel_data/id_ed25519
            echo "BESZEL_PUB=$BESZEL_PUB" > /opt/beszel/.env
            echo "==> [2/6] ufw cho docker subnet -> 45876"
            ufw allow from 172.16.0.0/12 to any port 45876 proto tcp comment beszel-hub-agent || true
            echo "==> [3/6] docker compose up"
            cd /opt/beszel
            docker compose up -d
            timeout 90 sh -c 'until curl -fsS http://127.0.0.1:8090/api/health >/dev/null 2>&1; do sleep 2; done'
            echo "==> [4/6] credentials"
            test -f /root/beszel-admin.txt || printf 'email: admin@hangocthanh.io.vn\npassword: %s\n' "$(openssl rand -base64 18 | tr -d '=+/')" > /root/beszel-admin.txt
            chmod 600 /root/beszel-admin.txt
            export BESZEL_PASS=$(awk '/^password:/{print $2}' /root/beszel-admin.txt)
            echo "==> [5/6] superuser + bootstrap.py"
            docker exec beszel /beszel superuser upsert admin@hangocthanh.io.vn "$BESZEL_PASS"
            python3 /opt/beszel/bootstrap.py
            echo "==> [6/6] Caddy block status.hangocthanh.io.vn"
            CADDY_CT=$(docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($0) ~ /caddy/ {print $1; exit}')
            CADDYFILE=$(docker inspect "$CADDY_CT" --format '{{range .Mounts}}{{.Source}} {{.Destination}}{{"\n"}}{{end}}' | awk '$2=="/etc/caddy/Caddyfile"{print $1; exit}')
            echo "Caddyfile: $CADDYFILE"
            if grep -q 'status.hangocthanh.io.vn' "$CADDYFILE"; then echo "Block da co - bo qua"; exit 0; fi
            cp "$CADDYFILE" "$CADDYFILE.bak-beszel-$(date +%Y%m%d-%H%M%S)"
            printf '\n# Beszel (deployHeadscale/beszel)\nstatus.hangocthanh.io.vn {\n\treverse_proxy beszel:8090\n}\n' >> "$CADDYFILE"
            docker exec "$CADDY_CT" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker exec "$CADDY_CT" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "XONG vpn6. Cred: /root/beszel-admin.txt"
        env:
          BESZEL_PRIV_B64: ${{ needs.keygen.outputs.priv_b64 }}
          BESZEL_PUB: ${{ needs.keygen.outputs.pub }}

  vpn4:
    name: Agent (vpn4)
    needs: [keygen, vpn6]
    runs-on: ubuntu-latest
    steps:
      - name: SSH vpn4
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          command_timeout: 10m
          envs: BESZEL_PUB
          script: |
            set -e
            echo "==> ufw: mo 45876 chi cho vpn6"
            ufw allow from 45.119.87.220 to any port 45876 proto tcp comment beszel-hub-vpn6 || true
            echo "==> beszel-agent container"
            docker rm -f beszel-agent 2>/dev/null || true
            docker run -d --name beszel-agent --network host --restart unless-stopped -e LISTEN=45876 -e KEY="$BESZEL_PUB" -v /var/run/docker.sock:/var/run/docker.sock:ro --log-opt max-size=10m --log-opt max-file=3 henrygd/beszel-agent:latest
            sleep 3
            docker ps --filter name=beszel-agent --format '{{.Names}} {{.Status}}'
            echo "XONG vpn4"
        env:
          BESZEL_PUB: ${{ needs.keygen.outputs.pub }}
