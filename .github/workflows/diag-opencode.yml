name: Diag opencode-server (vpn4, read-only)

# Chan doan READ-ONLY cho route opencode.hangocthanh.io.vn (edge-vpn4). KHONG
# recreate container, KHONG sua gi. Chi chay tay (dispatch) khi verify sau
# deploy tra HTTP 000/502 bat thuong.
on:
  workflow_dispatch:

concurrency:
  group: diag-vpn4-host
  cancel-in-progress: true

jobs:
  diag:
    name: SSH vpn4 doc trang thai edge + opencode-server
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN4 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          command_timeout: 5m
          script: |
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi

            echo "==> mang edge — container nao dang trong do"
            $SUDO docker network inspect edge --format '{{range .Containers}}{{.Name}} {{.IPv4Address}}{{"\n"}}{{end}}' 2>&1 || true

            echo ""
            echo "==> edge-vpn4 compose ps"
            $SUDO docker ps --filter "name=edge-nginx" --filter "name=caddy-edge" --format '{{.Names}}\t{{.Status}}' 2>&1 || true

            echo ""
            echo "==> opencode-server container co ton tai khong"
            $SUDO docker ps -a --filter "name=opencode-server" --format '{{.Names}}\t{{.Status}}' 2>&1 || echo "(khong thay container opencode-server)"

            echo ""
            echo "==> caddy-edge — 60 dong log cuoi"
            $SUDO docker logs --tail 60 caddy-edge 2>&1 || true

            echo ""
            echo "==> opencode-server — 30 dong log cuoi (neu co)"
            $SUDO docker logs --tail 30 opencode-server 2>&1 || true

            echo ""
            echo "==> thu goi opencode-server tu BEN TRONG mang edge (bo qua nginx/caddy)"
            $SUDO docker run --rm --network edge curlimages/curl:8.10.1 \
              -sS -o /dev/null -w 'noi bo opencode-server:4096 -> HTTP %{http_code}\n' \
              --max-time 5 http://opencode-server:4096/global/health 2>&1 || true
