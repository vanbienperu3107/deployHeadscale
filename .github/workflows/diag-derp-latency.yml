name: Diag DERP latency

# CHI DOC. Chay cac lenh SELECT tren postgres cua dashboard (vpn6) de chan doan
# latency DERP cua mot node. Khong ghi, khong sua container, khong doi config.
#
# Dung khi: "node X ping toi DERP cao qua" — de biet no dang dung region nao,
# so thuc te bao nhieu, di direct hay phai relay, va co phai chi rieng no bi hay
# ca fleet.
#
# DB nam trong container derp-postgres tren vpn6 (stack /opt/dashboard-vn).

on:
  workflow_dispatch:

jobs:
  diag:
    name: Doc telemetry tu postgres vpn6
    runs-on: ubuntu-latest
    steps:
      - name: SSH vpn6 va truy van
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_VPN6 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          command_timeout: 10m
          script_stop: true
          # Viet PHANG, khong if/else nhieu dong: appleboy/ssh-action chen
          # exit-check tung dong va lam chet script (bai hoc 2026-09-04).
          script: |
            set -e
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi
            PSQL="$SUDO docker exec -i derp-postgres psql -U derp -d derp -P pager=off"

            echo "===================================================="
            echo "1. HOME DERP hien tai cua tung client"
            echo "   region 1001=vpn4 (Lima/Peru), 1003=vpn6 (Vietnam)"
            echo "===================================================="
            $PSQL -c "SELECT hostname, home_region_id AS region, home_region_code AS code, round(controller_latency_ms::numeric,1) AS ctrl_ms, round(EXTRACT(EPOCH FROM (now()-reported_at))::numeric,0) AS tuoi_giay FROM client_home_derp ORDER BY hostname;"

            echo ""
            echo "===================================================="
            echo "2. PING TOI TUNG DERP REGION, moi client (30s/lan)"
            echo "===================================================="
            $PSQL -c "SELECT h.hostname, p.region_id AS region, p.region_code AS code, round(p.rtt_ms::numeric,1) AS rtt_ms, p.ok, round(EXTRACT(EPOCH FROM (now()-p.reported_at))::numeric,0) AS tuoi_giay FROM client_derp_ping p LEFT JOIN client_home_derp h ON h.mac = p.client ORDER BY h.hostname, p.region_id;"

            echo ""
            echo "===================================================="
            echo "3. LATENCY GIUA CAC NODE + DUONG DI"
            echo "   path='direct' = P2P that; path='derp:...' = phai relay"
            echo "===================================================="
            $PSQL -c "SELECT src_hostname, dst_hostname, round(rtt_ms::numeric,1) AS rtt_ms, path, ok, loss_pct, round(EXTRACT(EPOCH FROM (now()-reported_at))::numeric,0) AS tuoi_giay FROM latency_samples ORDER BY src_hostname, dst_hostname;"

            echo ""
            echo "===================================================="
            echo "4. CAU HINH DERP REGION dang phat trong DERPMap"
            echo "===================================================="
            $PSQL -c "SELECT region_id, code, node_name, hostname, enabled, paused, maintenance, priority FROM derp_servers ORDER BY region_id;"

            echo ""
            echo "===================================================="
            echo "5. GAN REGION THEO NODE (Feature B) + co exclusive + suc khoe"
            echo "   node_key doi chieu voi muc 6 de biet la may nao"
            echo "===================================================="
            $PSQL -c "SELECT a.node_key, a.region_id, o.exclusive FROM derp_node_assignments a LEFT JOIN derp_node_options o ON o.node_key = a.node_key ORDER BY a.node_key, a.region_id;"
            $PSQL -c "SELECT * FROM derp_node_options ORDER BY node_key;"
            $PSQL -c "SELECT * FROM derp_node_health ORDER BY node_key;"

            echo ""
            echo "===================================================="
            echo "6. BANG DOI node_key -> ten may (DB headscale, cung postgres)"
            echo "===================================================="
            $SUDO docker exec -i derp-postgres psql -U derp -d headscale -P pager=off -c "SELECT id, given_name, hostname, node_key, last_seen FROM nodes ORDER BY given_name;" || echo "(khong doc duoc DB headscale)"
