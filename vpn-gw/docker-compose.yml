# Stack VPN gateway tren vpn4. Hai container chia se network namespace:
#  - ts-vpngw : sidecar tailscale chinh thuc, giu IP 100.x tren tailnet.
#  - vpn-gw   : image GHCR (openvpn + tinyproxy + dnsmasq), chay network_mode:
#               service:ts-vpngw -> proxy :8888 nam tren chinh IP 100.x do.
# Client tro PAC toi <100.x>:8888. KHONG publish port ra host/internet.
# Xem docs/plan-vpn-gateway-bitel.md.

services:
  ts-vpngw:
    # GHIM TAG: ca stack dua vao ngu nghia cua containerboot (khi nao no chay
    # `tailscale up` vs `tailscale set`, khi nao no bat ip_forward). `:latest`
    # co the doi duoi chan giua mot cua so bao tri.
    image: tailscale/tailscale:v1.98.9
    container_name: ts-vpngw
    hostname: vpngw
    restart: unless-stopped
    # ⚠️ BAT BUOC khi node lam subnet router. containerboot goi ensureIPForwarding
    # va COI LOI LA FATAL (cmd/containerboot/main.go:187-196) — ma /proc/sys
    # trong container khong ghi duoc (da do: "Read-only file system"), nen no se
    # thoat -> restart: unless-stopped -> CRASHLOOP. Va vi ts-vpngw la CHU
    # NETNS, no chet keo theo vpn-gw (tinyproxy + tun0) chet cung.
    # Dat o day thi runtime ghi truoc khi containerboot doc -> no thay "1" va bo qua.
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      # ⚠️ KHONG dat --advertise-routes o day, va KHONG dat TS_ROUTES.
      #
      # containerboot ap route VO DIEU KIEN luc khoi dong (tailscaled.go:139-141
      # qua `up`, :172-174 qua `set`), trong khi TUN_WAIT=90 bao dam tun0 CHUA
      # len trong hang chuc giay dau. Neu itop dang offline dung luc do, gateway
      # gianh primary route trong trang thai chua forward duoc gi.
      #
      # Thay vao do: route-agent tren HOST la nguoi ghi DUY NHAT, va chi
      # advertise SAU khi probe TCP toi dich that su thanh cong
      # (advertise-on-healthy). Xem vpn-gw/route-agent.sh.
      # ⚠️ PHAI co "--advertise-routes=" (rong) o day. Tailscale tu choi lenh
      # `up` neu prefs hien tai co advertise-routes ma lenh khong nhac toi:
      #   Error: changing settings via 'tailscale up' requires mentioning all
      # Ma route-agent thi CO dat advertise-routes len node. Thieu co nay =
      # ts-vpngw CRASHLOOP moi lan restart, keo theo tinyproxy + tun0 chet cung
      # (su co 2026-08-09, RestartCount len 13).
      #
      # De rong = moi lan container khoi dong lai, route bi xoa va agent phai
      # probe thanh cong roi moi dat lai (~60s). Do la fail-safe dung huong:
      # khong quang ba route khi chua chung minh duong con song.
      - TS_EXTRA_ARGS=--login-server=https://vpn2.hangocthanh.io.vn --hostname=vpngw --accept-dns=false --advertise-routes=
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
    volumes:
      - tailscale_vpngw:/var/lib/tailscale
      - ts_vpngw_sock:/var/run/tailscale
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  vpn-gw:
    image: ghcr.io/vanbienperu3107/vpn-gw:latest
    container_name: vpn-gw
    restart: unless-stopped
    # Vao netns cua sidecar tailscale -> tinyproxy :8888 tren IP 100.x.
    network_mode: "service:ts-vpngw"
    environment:
      - OVPN_CONFIG=/config/client.ovpn
      - OVPN_AUTH=/config/auth.txt
      - PROXY_PORT=8888
      # DNS noi bo Bitel + domain split (mac dinh da dung, override neu doi).
      - BITEL_DOMAIN=bitel.com.pe
      - BITEL_DNS1=10.121.127.193
      - BITEL_DNS2=10.121.127.194
      - TUN_WAIT=90
      # Dich probe "duong con song that" — TCP toi dung cong dich vu nguoi dung
      # can. KHONG dung ping (may dich chan ICMP) va khong dung link-state tun0
      # (Bitel chan theo tai khoan thi tun0 van UP ma khong toi duoc gi).
      - PROBE_TARGET=${PROBE_TARGET:-10.121.124.155:3389}
      - PROBE_TIMEOUT=${PROBE_TIMEOUT:-4}
      # =1 khi node dang lam subnet router: healthcheck coi ip_forward=0 la hong.
      - REQUIRE_FORWARD=${REQUIRE_FORWARD:-0}
      # Telemetry (Phase 5): bao trang thai len dashboard. Trong = tat.
      - DASHBOARD_URL=${DASHBOARD_URL:-}
      - VPN_GW_NAME=${VPN_GW_NAME:-}
      - VPN_GW_AGENT_TOKEN=${VPN_GW_AGENT_TOKEN:-}
      - REPORT_INTERVAL=${REPORT_INTERVAL:-30}
    volumes:
      # Fallback: entrypoint uu tien lay authUsername/ovpnPass/ovpnConfig tu
      # dashboard (DASHBOARD_URL/VPN_GW_NAME/VPN_GW_AGENT_TOKEN o duoi). File o
      # day chi duoc dung khi khong goi duoc dashboard hoac gateway chua duoc
      # cau hinh credential qua CMS.
      - ./config:/config:ro
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    depends_on:
      - ts-vpngw
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  tailscale_vpngw:
  ts_vpngw_sock:
